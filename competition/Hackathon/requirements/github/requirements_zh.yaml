id: ROOT
name: GitHub 协作平台核心需求
type: FOLDER
dependencies: []
description: 一个精简的 GitHub 风格协作平台，聚焦账户访问、组织与成员、仓库及其 Git 内容、议题、拉取请求和基础访问控制。用户先以访客或已认证会话进入；所有写操作均在明确的账户、组织、仓库、分支或工作项上下文中执行。账户、会话、组织成员与团队、仓库及可见性/访问角色、分支与提交、文件内容、议题与评论、拉取请求及评审/合并状态必须持久化；页面重新打开时应基于最后一次成功保存的状态恢复。任何写操作均先验证当前身份和资源权限，失败时显示原因且不产生部分对象或部分状态变更。实时协作、Actions、Packages、Wiki、项目看板、通知投递和外部 Git 远程协议不属于本核心范围。
children:
- id: REQ-1
  name: 身份与访问
  type: FOLDER
  dependencies: []
  description: 管理访客到已认证用户的身份生命周期。账户使用唯一登录名和已验证邮箱标识；密码仅以安全凭据形式保存，界面、可见日志和恢复流程不得回显或泄露完整密码。登录成功创建可撤销的 Web 会话，后续组织、仓库和工作项页面均从该会话解析当前用户与权限；退出、密码变更和恢复流程必须使会话状态与可见页面保持一致。除非某个子需求另有说明，用户名必须为 1 至 39 个小写 ASCII 字母、数字或单连字符（`-`），且不得以连字符开始或结束；密码必须为 12 至 128 个字符，同时至少包含一个大写字母、一个小写字母、一个数字和一个非字母数字特殊字符，且不得包含空白字符。
  children:
  - id: REQ-1-1
    name: 账户注册与恢复
    type: FOLDER
    dependencies: []
    description: 从账户访问页完成注册、登录和恢复。注册产生待验证或可用账户；登录仅为已验证且凭据有效的账户创建会话；恢复仅基于已验证邮箱发起，并以不暴露账户是否存在或其他机密信息的方式提供后续步骤。注册、登录和恢复页面必须以可见标签标识字段和提交操作；失败后保留非敏感输入，密码和确认密码字段不得回显已提交值。
    children:
    - id: REQ-1-1-1
      name: 注册新的 GitHub 账户
      type: ATOMIC
      dependencies: []
      description: >-
        访客点击“Sign up”，依次输入唯一用户名、邮箱、密码和确认密码，勾选同意条款后点击“Create account”。用户名须符合 REQ-1 的 1–39 位格式规则；邮箱去除首尾空白后必须包含单个 `@`、长度不超过 254 个字符，且 `@` 后包含至少一个点号与非空域名标签；密码须符合 REQ-1 的 12–128 位复杂度规则，确认密码必须逐字符相同。系统创建待验证账户并显示邮箱验证提示；用户名或邮箱冲突、任一字段缺失、邮箱格式错误、未同意条款、密码不合规或确认密码不一致时保留用户名和邮箱输入，在对应字段旁逐项提示，并且不创建账户或开始验证。
        访客可在账户访问页面使用此能力。 此能力要求访客能够提供所需账户信息。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统创建新账户或开始对其进行验证，并在所需检查完成后使该账户可用。


        截图参考：

        ![image](reference/github-sign-up.png)
      scenarios:
      - name: 注册新的 GitHub 账户
        steps:
        - keyword: GIVEN
          content: Visitor is in the relevant GitHub context, and the visitor can provide the required account information.
        - keyword: WHEN
          content: 访客点击“Sign up”，依次输入唯一用户名、邮箱、密码和确认密码，勾选同意条款后点击“Create account”。
        - keyword: THEN
          content: 系统创建待验证账户并显示邮箱验证提示；用户名或邮箱冲突、密码不合规时保留表单并逐项提示。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-1-1-2
      name: 使用现有账户登录
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: >-
        此功能建立在 REQ-1-1-1（注册新的 GitHub 账户） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        访客在账户访问页输入登录名或已验证邮箱及密码并提交。系统查找账户、校验凭据和账户可用状态；认证失败（未知登录名/邮箱、错误密码、未验证或不可用账户）时显示完全相同的通用失败提示，不泄露账户是否存在或哪一项凭据错误，也不创建会话。认证成功后创建带唯一会话标识、账户标识和有效状态的 Web 会话，跳转到该用户可访问的工作区；刷新或重新打开工作区时会话仍有效，后续受保护的组织、仓库和工作项请求必须使用此会话确定当前用户。


        截图参考：

        ![image](reference/github-sign-in.png)
      scenarios:
      - name: 使用现有账户登录
        steps:
        - keyword: GIVEN
          content: Visitor is in the relevant GitHub context, and the visitor has an existing account and valid credentials.
        - keyword: WHEN
          content: 用户在登录表单输入登录名或已验证邮箱和密码后点击“Sign in”。
        - keyword: THEN
          content: 系统启动已认证会话，并显示已登录用户的工作区。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-1-1-3
      name: 通过已验证邮箱恢复账户访问
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: >-
        访客点击“Forgot password”，输入邮箱并点击“Send reset link”，再通过收到的重置链接输入并确认新密码。无论邮箱是否对应已验证账户，系统均显示完全相同的通用发送结果。只为已验证邮箱生成重置链接；链接自发出起 30 分钟内有效、仅能成功使用一次，并绑定到该账户。验证链接有效且新密码符合 REQ-1 的密码规则并逐字符确认一致时，系统更新凭据；链接无效、过期、已使用、密码不合规或确认不一致时，系统不修改账户。
        此功能建立在 REQ-1-1-1（注册新的 GitHub 账户） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        访客可在账户访问页面使用此能力。 此能力要求访客能够识别已验证的账户邮箱地址。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统接受恢复请求，并在不暴露账户机密信息的情况下提供下一步账户恢复操作。


        截图参考：

        ![image](reference/github-password-reset.png)
      scenarios:
      - name: 通过已验证邮箱恢复账户访问
        steps:
        - keyword: GIVEN
          content: Visitor is in the relevant GitHub context, and the visitor can identify a verified account email address.
        - keyword: WHEN
          content: 访客点击“Forgot password”，输入已验证邮箱并点击“Send reset link”，再通过收到的重置链接输入并确认新密码。
        - keyword: THEN
          content: 系统仅显示通用发送结果；验证链接有效且新密码合规时更新凭据，否则不修改账户。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-1-2
    name: 退出登录并结束当前 Web 会话
    type: ATOMIC
    dependencies:
    - REQ-1-1-2
    description: >-
      此功能建立在 REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      已登录用户可从账户访问区域结束当前 Web 会话。系统在出现确认对话框时，只有点击确认才退出，取消或关闭对话框必须保留当前会话。确认退出后系统立即使活动会话失效；刷新、浏览器后退或直接重新打开此前可访问的受保护账户、仓库或组织 URL 都必须恢复为未认证访问状态并要求重新认证。


      截图参考：

      ![image](reference/github-account-menu-sign-out.png)
    scenarios:
    - name: 退出登录并结束当前 Web 会话
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
      - keyword: WHEN
        content: 用户点击账户头像菜单中的“Sign out”，并在出现确认框时确认退出。
      - keyword: THEN
        content: 活动会话结束，受保护的账户页面需要重新身份验证。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-1-3
    name: 修改账户密码
    type: ATOMIC
    dependencies:
    - REQ-1-1-2
    description: >-
      此功能建立在 REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      已登录用户可从账户安全设置修改账户密码。用户必须提供当前密码、符合 REQ-1 密码规则的新密码和逐字符一致的确认密码；三项均为必填。系统验证该变更、防止未经授权的更新，并将新密码应用于后续登录尝试。当前密码错误、新密码不合规、确认不一致或任一字段缺失时，系统在对应字段显示原因，不修改凭据；旧密码继续有效，新密码不得用于登录。成功更新后，新密码立即用于后续基于密码的登录，旧密码不得再用于新登录。


      截图参考：

      ![image](reference/github-password-settings.png)
    scenarios:
    - name: 修改账户密码
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
      - keyword: WHEN
        content: 用户在密码设置页输入当前密码、新密码和确认密码后点击“Update password”。
      - keyword: THEN
        content: 新密码会被保存，并用于后续基于密码的登录。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
- id: REQ-2
  name: 组织与治理
  type: FOLDER
  dependencies:
  - REQ-1-1-2
  description: 管理归属于已认证账户的组织及其治理关系。组织具有唯一标识、显示名、所有者集合、成员资格、团队层级和仓库访问授予；组织成员与团队权限决定后续可见的组织仓库以及可执行的管理操作。所有成员、邀请、团队和授权变更必须在组织详情、成员/团队列表及受影响仓库访问检查中一致体现。 此功能建立在 REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
  children:
  - id: REQ-2-1
    name: 组织身份与发现
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: 支持发现可公开访问的组织仓库，并由已认证用户创建组织。组织唯一名称采用 REQ-1 用户名的 1–39 位小写 ASCII 格式并全局唯一；显示名为 1–100 个去除首尾空白后非空的字符。创建成功后应进入或可从组织页定位新组织；组织数据与当前账户/所有者关系持久化，后续团队、成员和仓库授权均在该组织上下文内进行。 此功能建立在 REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-2-1-1
      name: 浏览组织仓库
      type: ATOMIC
      dependencies: []
      description: >-
        用户从组织页点击“Repositories”标签，可在筛选框输入仓库名、选择公开/私有筛选，并点击列表中的仓库名称打开概览。 系统仅显示当前用户可见的仓库名称、描述、可见性和更新时间；点击结果后进入该仓库概览。
        访客或组织成员可在组织管理页面或公共组织页面使用此能力。 此能力要求目标公共对象可用，或用户具有查看权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 所请求的信息会显示出来，并向用户展示相关筛选器、元数据或状态指示器。


        截图参考：

        ![image](reference/github-organization-repositories.png)
      scenarios:
      - name: 浏览组织仓库
        steps:
        - keyword: GIVEN
          content: Visitor or organization member is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: 用户从组织页点击“Repositories”标签，可在筛选框输入仓库名、选择公开/私有筛选，并点击列表中的仓库名称打开概览。
        - keyword: THEN
          content: 系统仅显示当前用户可见的仓库名称、描述、可见性和更新时间；点击结果后进入该仓库概览。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-2-1-2
      name: 身份验证后创建组织
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: 已登录用户从组织创建页输入组织唯一名称和显示信息并确认。组织名称必须符合 REQ-1 用户名的 1–39 位小写 ASCII 格式并全局唯一；显示名必须为 1–100 个去除首尾空白后非空的字符。系统验证这些规则，创建组织标识、显示名和创建时间，并将当前用户作为初始所有者与成员保存；名称或显示名不合规、名称冲突或写入失败时保留非敏感输入、在对应字段显示原因且不创建组织。成功后跳转到新组织概览页，组织出现在当前用户可访问的组织列表中，后续团队、成员和仓库授权均以该组织标识为范围。 此功能建立在 REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      scenarios:
      - name: 身份验证后创建组织
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: 用户在组织创建页输入唯一组织名和显示信息后点击“Create organization”。
        - keyword: THEN
          content: 新对象或关系会被保存，并出现在相关 GitHub 上下文中。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-2-2
    name: 团队与成员管理
    type: FOLDER
    dependencies:
    - REQ-2-1-2
    description: 在当前组织的成员和团队管理页创建团队、维护团队层级和成员关系、邀请或移除组织成员。团队名为 1–50 个小写 ASCII 字母、数字或连字符，不能以连字符开始或结束，且在同一组织内唯一；团队必须属于一个组织，父团队必须属于同一组织且不能形成直接或间接循环。成员身份、邀请状态和团队隶属关系是独立的持久化关系。对已有成员或已有待接受邀请的同一账户不得重复创建邀请。移除成员后，应同步撤销其通过组织直接获得的访问资格，但不得删除其个人账户或无关资源。 此功能建立在 REQ-2-1-2（身份验证后创建组织） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-2-2-1
      name: 创建组织团队
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: 组织所有者可在组织管理页面或公共组织页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的组织权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 新对象或关系会被保存，并出现在相关 GitHub 上下文中。 此功能建立在 REQ-2-1-2（身份验证后创建组织） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。组织所有者在组织页点击“Teams”→“New team”，输入符合 REQ-2-2 名称规则的团队名称、可选描述和同组织父团队后点击“Create team”。系统创建归属当前组织的团队并跳转到团队页；名称缺失、格式错误、重复、父团队不属于当前组织或创建失败时不生成团队。
      scenarios:
      - name: 创建组织团队
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: 组织所有者在组织页点击“Teams”→“New team”，输入团队名称、可选描述和父团队后点击“Create team”。
        - keyword: THEN
          content: 系统创建归属当前组织的团队并跳转到团队页；名称重复或创建失败时不生成团队。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-2-2-2
      name: 管理组织团队成员与层级
      type: ATOMIC
      dependencies:
      - REQ-2-2-1
      description: 访客或组织成员可在组织管理页面或公共组织页面使用此能力。 此能力要求用户已通过身份验证，并有权访问相关账户、仓库或组织。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统显示可观察的结果，并保留变更后的状态以供后续使用。 此功能建立在 REQ-2-2-1（创建组织团队） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。 团队维护者在团队页点击“Members”添加或移除成员，或在“Settings”选择新的父团队并保存。 系统更新成员关系或团队层级，并在组织团队树和成员列表中立即反映；禁止形成循环层级。
      scenarios:
      - name: 管理组织团队成员与层级
        steps:
        - keyword: GIVEN
          content: Visitor or organization member is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: 团队维护者在团队页点击“Members”添加或移除成员，或在“Settings”选择新的父团队并保存。
        - keyword: THEN
          content: 系统更新成员关系或团队层级，并在组织团队树和成员列表中立即反映；禁止形成循环层级。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: 拒绝把后代团队设为父团队
        steps:
        - keyword: GIVEN
          content: 团队维护者打开一个已经存在父团队的组织团队。
        - keyword: WHEN
          content: 维护者选择该团队的某个后代团队作为新的父团队并保存。
        - keyword: THEN
          content: 系统拒绝该循环关系，保持原父团队不变，并在重新加载后继续显示原有层级。
    - id: REQ-2-2-3
      name: 邀请用户加入组织
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: 组织所有者可在组织管理页面或公共组织页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的组织权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统显示可观察的结果，并保留变更后的状态以供后续使用。 此功能建立在 REQ-2-1-2（身份验证后创建组织） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。组织所有者在“People”页点击“Invite member”，输入现有账户的用户名或已验证邮箱，选择“Member”或“Owner”角色后点击“Send invitation”。系统保存待接受邀请并显示受邀人和状态；受邀人接受前不取得组织成员权限。对已有成员、已有待接受邀请、未知账户或不支持角色，系统显示原因且不创建第二条邀请。
      scenarios:
      - name: 邀请用户加入组织
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: 组织所有者在“People”页点击“Invite member”，输入用户名或邮箱、选择组织角色后点击“Send invitation”。
        - keyword: THEN
          content: 系统保存待接受邀请并显示受邀人和状态；受邀人接受前不取得组织成员权限。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-2-2-4
      name: 从组织中移除成员
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: 组织所有者可在组织管理页面或公共组织页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的组织权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 所选对象或权限在确认后被移除，后续视图会反映该移除结果。 此功能建立在 REQ-2-1-2（身份验证后创建组织） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。 组织所有者在“People”页定位成员，点击其操作菜单中的“Remove from organization”，并在确认对话框中点击“Remove”。 系统移除该成员的组织身份和直接组织访问；成员账户、其个人仓库及其他组织关系保持不变。
      scenarios:
      - name: 从组织中移除成员
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: 组织所有者在“People”页定位成员，点击其操作菜单中的“Remove from organization”，并在确认对话框中点击“Remove”。
        - keyword: THEN
          content: 系统移除该成员的组织身份和直接组织访问；成员账户、其个人仓库及其他组织关系保持不变。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: 阻止非所有者移除组织成员
        steps:
        - keyword: GIVEN
          content: 一个已登录但不是组织所有者的用户打开组织 People 页面并看到某个成员。
        - keyword: WHEN
          content: 该用户打开成员操作菜单并尝试移除该成员。
        - keyword: THEN
          content: 对非所有者来说移除操作不可用或被拒绝，且重新加载后该成员仍属于组织。
  - id: REQ-2-3
    name: 向人员和团队授予仓库访问权限
    type: ATOMIC
    dependencies:
    - REQ-2-1-2
    - REQ-2-2-1
    description: 组织所有者或仓库管理员可向人员或团队授予仓库访问权限，并选择基础角色“Read”“Triage”“Write”“Maintain”或“Admin”。系统仅接受当前组织的成员或团队，每个主体在同一仓库只有一条有效角色授予；重复授予相同角色不创建第二条记录，变更角色替换原角色。系统应用权限分配，防止未经授权的角色变更，并允许成员按授予的角色访问仓库。 此功能建立在 REQ-2-1-2（身份验证后创建组织）、REQ-2-2-1（创建组织团队） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    scenarios:
    - name: 向人员和团队授予仓库访问权限
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: 管理员在仓库“Manage access”页选择成员或团队、选择角色并点击“Add”或“Save”。
      - keyword: THEN
        content: 系统应用权限分配，成员可根据授予的角色访问仓库。
      - keyword: THEN
        content: 当对象再次打开时，可见状态保持一致。
    - name: 替换已有仓库授权而不是重复创建
      steps:
      - keyword: GIVEN
        content: 管理员打开一个已经为团队保存了授权的仓库访问管理页面。
      - keyword: WHEN
        content: 管理员把该团队的角色改成另一种级别并保存更新。
      - keyword: THEN
        content: 系统只保留一条团队授权记录，用新角色替换旧角色，并在重新加载后显示更新后的授权。
- id: REQ-3
  name: 仓库资产管理
  type: FOLDER
  dependencies: []
  description: 支持发现、创建、查看和配置仓库。每个仓库必须保存唯一所有者命名空间与名称、可见性、描述、创建者、默认分支、分支指针、提交历史和协作者/团队访问角色；仓库页是代码、议题和拉取请求的共同入口。公开仓库可被访客读取，私有仓库仅向所有者、成员或被授予角色的主体显示；改变可见性或访问授权后，后续所有仓库读取入口必须执行同一规则。
  children:
  - id: REQ-3-1
    name: 搜索并定位仓库
    type: ATOMIC
    dependencies: []
    description: >-
      访客或已登录用户可搜索其有权查看的仓库。 系统接收搜索查询，应用面向仓库的筛选或范围限定，并显示匹配仓库及足够的元数据，以便用户打开目标仓库。


      截图参考：

      ![image](reference/github-repository-search-results.png)
    scenarios:
    - name: 搜索仓库、代码、议题、拉取请求和用户
      steps:
      - keyword: GIVEN
        content: Repository collaborator is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
      - keyword: WHEN
        content: 用户在全局搜索框输入仓库关键词并按 Enter，使用筛选后点击目标仓库。
      - keyword: THEN
        content: 匹配的仓库会显示足够的元数据，供用户选择并打开目标仓库。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-3-2
    name: 仓库创建与分发
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: 支持从仓库创建页新建仓库、从已可访问的源仓库创建 fork，以及从仓库页复制克隆 URL。新仓库与 fork 都必须进入可浏览的仓库上下文；fork 保留源仓库引用但拥有独立的所有者、分支和后续提交历史。 此功能建立在 REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-3-2-1
      name: 使用所有者、可见性和初始化选项创建仓库
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: >-
        此功能建立在 REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        已登录用户在仓库创建页选择个人或组织所有者、输入仓库名称和描述、选择公开或私有可见性，并选择是否用 README 创建初始提交。系统验证用户可在该所有者命名空间创建仓库、名称唯一且选项有效；成功时保存仓库标识、所有者、可见性、默认分支和创建者。选择初始化时还须原子创建初始分支、README 文件和初始提交；任一步失败均不留下半创建的仓库。成功后进入新仓库概览页。


        截图参考：

        ![image](reference/github-create-repository.png)
      scenarios:
      - name: 使用所有者、可见性和初始化选项创建仓库
        steps:
        - keyword: GIVEN
          content: Authorized administrator is in the relevant GitHub context, and the user is authenticated and has administrator permission for the target repository.
        - keyword: WHEN
          content: 用户在新建仓库页选择所有者和可见性、填写名称并选择初始化选项后点击“Create repository”。
        - keyword: THEN
          content: 新对象或关系会被保存，并出现在相关 GitHub 上下文中。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-3-2-2
      name: 将仓库 fork 到另一个命名空间
      type: ATOMIC
      dependencies:
      - REQ-3-3
      - REQ-1-1-2
      description: >-
        用户在源仓库页点击“Fork”，选择目标个人或组织命名空间、填写可选新名称和可见性后点击“Create fork”。 系统创建独立 fork、复制可访问的默认分支历史并记录源仓库链接，随后打开新的 fork 概览页。
        此功能建立在 REQ-3-3（查看公共仓库概览）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        已登录用户可在仓库页面使用此能力。 此能力要求用户已通过身份验证，并有权访问相关账户、仓库或组织。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 新的 fork 会在所选所有者名下创建，并链接回源仓库。


        截图参考：

        ![image](reference/github-fork-repository.png)
      scenarios:
      - name: 将仓库 fork 到另一个命名空间
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: 用户在源仓库页点击“Fork”，选择目标个人或组织命名空间、填写可选新名称和可见性后点击“Create fork”。
        - keyword: THEN
          content: 系统创建独立 fork、复制可访问的默认分支历史并记录源仓库链接，随后打开新的 fork 概览页。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-3-2-3
      name: 复制仓库克隆 URL
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >-
        用户在仓库概览页点击“Code”，选择 HTTPS 或 SSH 克隆方式，再点击 URL 右侧的复制图标。 系统将所选克隆 URL 写入浏览器剪贴板，并显示短暂的“Copied”反馈；该只读操作不修改仓库。
        此功能建立在 REQ-3-3（查看公共仓库概览） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        访客或已登录用户可在仓库页面使用此能力。 此能力要求目标公共对象可用，或用户具有查看权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 所选仓库访问值可供用户粘贴到本地工具中。


        截图参考：

        ![image](reference/github-code-clone-menu.png)
      scenarios:
      - name: 复制仓库克隆 URL
        steps:
        - keyword: GIVEN
          content: Visitor or authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: 用户在仓库概览页点击“Code”，选择 HTTPS 或 SSH 克隆方式，再点击 URL 右侧的复制图标。
        - keyword: THEN
          content: 系统将所选克隆 URL 写入浏览器剪贴板，并显示短暂的“Copied”反馈；该只读操作不修改仓库。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-3-3
    name: 查看公共仓库概览
    type: ATOMIC
    dependencies: []
    description: >-
      访客或授权用户可打开仓库概览，以确认仓库身份、可见性、描述、主要元数据和可用内容。 该概览提供浏览文件、查看仓库上下文并开始协作的主要入口。


      截图参考：

      ![image](reference/github-repository-overview.png)
    scenarios:
    - name: 查看公共仓库概览
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: 用户从搜索结果、个人/组织仓库列表或直接链接点击仓库名称打开概览。
      - keyword: THEN
        content: 该概览提供浏览文件并开始协作的入口。
      - keyword: THEN
        content: 当对象再次打开时，可见状态保持一致。
  - id: REQ-3-4
    name: 在权限检查下修改仓库可见性
    type: ATOMIC
    dependencies:
    - REQ-3-3
    - REQ-1-1-2
    description: >-
      此功能建立在 REQ-3-3（查看公共仓库概览）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      仓库管理员在查看对访问权限的影响后修改仓库可见性。 系统阻止未经授权的变更，应用所选可见性，并在用户后续打开仓库时执行更新后的访问规则。


      截图参考：

      ![image](reference/github-repository-visibility-settings.png)
    scenarios:
    - name: 在权限检查下修改仓库可见性
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: 管理员在仓库“Settings”→“General”中选择可见性，点击“Change visibility”并确认。
      - keyword: THEN
        content: 系统防止未经授权的变更，并将更新后的可见性应用于后续仓库访问。
      - keyword: THEN
        content: 当对象再次打开时，可见状态保持一致。
- id: REQ-4
  name: 代码与版本控制
  type: FOLDER
  dependencies:
  - REQ-3-3
  description: 支持在选定仓库和分支上下文中浏览 Git 内容、提交历史、差异和分支，并通过 Web 编辑器产生新提交。页面任何文件、提交或比较结果都应明确标识其仓库、分支或修订；写入文件时不能直接覆盖历史内容，而要创建关联作者、父修订和目标分支的新提交。分支切换仅改变浏览/编辑上下文，不修改默认分支或其他分支内容。 此功能建立在 REQ-3-3（查看公共仓库概览） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
  children:
  - id: REQ-4-1
    name: 浏览仓库文件和目录
    type: ATOMIC
    dependencies:
    - REQ-3-3
    description: >-
      此功能建立在 REQ-3-3（查看公共仓库概览） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      仓库参与者可在所选分支上浏览文件夹和文件，打开嵌套目录，并结合足够的元数据查看文件内容以理解当前仓库状态。


      截图参考：

      ![image](reference/github-code-file-browser.png)
    scenarios:
    - name: 浏览仓库文件和目录
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: 用户在仓库概览点击目录名称逐级进入，或点击文件名查看该文件在当前分支的内容。
      - keyword: THEN
        content: 所选分支会显示其文件夹、文件、嵌套路径和可读文件内容。
      - keyword: THEN
        content: 当对象再次打开时，可见状态保持一致。
  - id: REQ-4-2
    name: 提交历史与代码搜索
    type: FOLDER
    dependencies:
    - REQ-4-1
    description: 在当前仓库及选定分支、路径或修订范围内查看提交历史、比较差异和搜索代码。提交记录至少应可追溯到提交标识、作者、时间、消息、父修订和变更文件；比较与搜索为只读操作，必须遵循当前仓库可见性和访问权限。 此功能建立在 REQ-4-1（浏览仓库文件和目录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-4-2-1
      name: 查看仓库提交历史
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >-
        此功能建立在 REQ-4-1（浏览仓库文件和目录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        仓库参与者可查看分支或文件上下文的提交历史，以了解近期变更及其提交者。


        截图参考：

        ![image](reference/github-commit-history.png)
      scenarios:
      - name: 查看仓库提交历史
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 用户在仓库页点击提交数量链接或“Commits”，并选择分支或文件路径范围查看历史。
        - keyword: THEN
          content: 仓库参与者可查看分支或文件上下文的提交历史，以了解近期变更及其提交者。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
    - id: REQ-4-2-2
      name: 检查提交和修订差异
      type: ATOMIC
      dependencies:
      - REQ-4-2-1
      description: >-
        此功能建立在 REQ-4-2-1（查看仓库提交历史） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        仓库参与者可比较提交或修订并检查已更改文件，以便在后续工作或拉取请求之前评审代码变更。


        截图参考：

        ![image](reference/github-commit-diff.png)
      scenarios:
      - name: 检查提交和修订差异
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 用户在提交列表点击某个提交哈希，或在比较页面选择两个修订后点击“Compare”。
        - keyword: THEN
          content: 仓库参与者可比较提交或修订并检查已更改文件，以便在后续工作或拉取请求之前评审代码变更。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
    - id: REQ-4-2-3
      name: 在仓库范围内搜索代码
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >-
        用户在仓库页顶部搜索框输入代码关键词并按 Enter，选择“Code”结果页，可继续按路径或语言筛选并点击匹配文件。 系统在当前仓库可见代码范围内显示匹配片段、文件路径和分支/修订上下文；点击结果打开对应文件位置。
        此功能建立在 REQ-4-1（浏览仓库文件和目录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        访客或已登录用户可在仓库代码和版本控制页面使用此能力。 此能力要求目标公共对象可用，或用户具有查看权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 所请求的信息会显示出来，并向用户展示相关筛选器、元数据或状态指示器。


        截图参考：

        ![image](reference/github-repository-code-search.png)
      scenarios:
      - name: 在仓库范围内搜索代码
        steps:
        - keyword: GIVEN
          content: Visitor or authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: 用户在仓库页顶部搜索框输入代码关键词并按 Enter，选择“Code”结果页，可继续按路径或语言筛选并点击匹配文件。
        - keyword: THEN
          content: 系统在当前仓库可见代码范围内显示匹配片段、文件路径和分支/修订上下文；点击结果打开对应文件位置。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: 代码搜索无匹配项时显示空状态
        steps:
        - keyword: GIVEN
          content: 用户已经在仓库代码搜索页面中选择了仓库范围。
        - keyword: WHEN
          content: 用户输入一个不会命中任何代码的查询并打开 Code 结果视图。
        - keyword: THEN
          content: 系统显示空结果状态，保持仓库范围和筛选条件不变，并且不打开任何文件。
  - id: REQ-4-3
    name: 分支与标签管理
    type: FOLDER
    dependencies:
    - REQ-4-1
    description: 支持列出并切换浏览分支、从明确的已有修订创建分支，以及修改仓库默认分支。分支名称为 1–255 个字符，只能包含 ASCII 字母、数字、`-`、`_`、`.` 和 `/`，不得以 `/`、`.` 结尾，不得包含连续 `..` 或 `//`；每个分支保存唯一名称和指向提交。创建分支不得复制或改写源分支历史；重名、非法名称或无权限时不得创建分支。默认分支只影响新打开仓库和未显式指定分支的入口，不能改变现有分支、提交或已打开拉取请求的源/目标引用。 此功能建立在 REQ-4-1（浏览仓库文件和目录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-4-3-1
      name: 列出并切换仓库分支
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >-
        此功能建立在 REQ-4-1（浏览仓库文件和目录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        仓库参与者可列出可用分支、识别当前活动分支，并将仓库上下文切换到其他分支以进行浏览或编辑。


        截图参考：

        ![image](reference/github-branch-selector.png)
      scenarios:
      - name: 列出并切换仓库分支
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 用户打开分支选择器，在列表中搜索并点击目标分支名称。
        - keyword: THEN
          content: 仓库参与者可列出可用分支、识别当前活动分支，并将仓库上下文切换到其他分支以进行浏览或编辑。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
      - name: 没有匹配项时保持当前活动分支不变
        steps:
        - keyword: GIVEN
          content: 仓库参与者在仓库页面打开分支选择器，且当前已有活动分支。
        - keyword: WHEN
          content: 参与者输入一个没有匹配结果的分支查询。
        - keyword: THEN
          content: 系统显示空的分支搜索状态，并在关闭选择器或重新加载后继续保留当前活动分支。
    - id: REQ-4-3-2
      name: 基于现有修订创建分支
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >-
        用户打开分支选择器，输入新分支名，确认显示的基准分支或提交后点击“Create branch: <name>”。 系统创建指向该基准提交的新分支并在选择器中切换到它；名称已存在或无权限时不创建。
        此功能建立在 REQ-4-3-1（列出并切换仓库分支）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        已登录用户可在仓库代码和版本控制页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的仓库协作权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 新对象或关系会被保存，并出现在相关 GitHub 上下文中。


        截图参考：

        ![image](reference/github-create-branch.png)
      scenarios:
      - name: 基于现有修订创建分支
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: 用户打开分支选择器，输入新分支名，确认显示的基准分支或提交后点击创建分支按钮。
        - keyword: THEN
          content: 系统创建指向该基准提交的新分支并在选择器中切换到它；名称已存在或无权限时不创建。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-4-3-3
      name: 修改仓库默认分支
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >-
        仓库管理员进入“Settings”→“Branches”，在“Default branch”下拉框选择已有分支并点击“Update”，再确认变更。 系统保存新的默认分支并更新新访问仓库时的初始分支；不会删除或重写原默认分支。
        此功能建立在 REQ-4-3-1（列出并切换仓库分支）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        已登录用户可在仓库代码和版本控制页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的仓库协作权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 更新后的配置、关系或状态会被保存，并在对象重新打开时继续生效。


        截图参考：

        ![image](reference/github-default-branch-settings.png)
      scenarios:
      - name: 修改仓库默认分支
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: 仓库管理员进入“Settings”→“Branches”，在“Default branch”下拉框选择已有分支并点击“Update”，再确认变更。
        - keyword: THEN
          content: 系统保存新的默认分支并更新新访问仓库时的初始分支；不会删除或重写原默认分支。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: 阻止非管理员修改默认分支
        steps:
        - keyword: GIVEN
          content: 一个没有仓库管理权限的已登录用户打开仓库设置的分支页面。
        - keyword: WHEN
          content: 该用户尝试查看或更新默认分支设置。
        - keyword: THEN
          content: 对非管理员来说默认分支更新操作不可用或被拒绝，且已保存的默认分支保持不变。
  - id: REQ-4-4
    name: 通过 Web 界面管理仓库文件
    type: ATOMIC
    dependencies:
    - REQ-4-1
    - REQ-1-1-2
    description: >-
      此功能建立在 REQ-4-1（浏览仓库文件和目录）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      仓库贡献者在当前仓库和已选分支的文件浏览页创建、编辑、上传、重命名或删除文件，并填写 1–72 个去除首尾空白后非空字符的提交消息后确认。新建或重命名的文件路径不得为空、不得以 `/` 开始、不得包含 `..` 路径段，且不得与当前分支上的现有文件或目录冲突。系统验证该用户对目标分支的写权限及分支保护规则，基于当前分支头创建一个新提交，保存提交作者、消息、父提交、变更文件路径和新文件内容，并将该分支指针原子更新到新提交。若文件路径冲突、内容校验失败、提交消息不合规、分支受保护或写入失败，页面显示原因且不改变文件、分支头或提交历史。


      截图参考：

      ![image](reference/github-web-file-editor.png)
    scenarios:
    - name: 通过 Web 界面管理仓库文件
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: 用户在文件页点击“Edit”或“Add file”，完成内容修改后填写提交信息并点击“Commit changes”。
      - keyword: THEN
        content: 系统将产生的文件变更保存为仓库提交。
      - keyword: THEN
        content: 当对象再次打开时，可见状态保持一致。
- id: REQ-5
  name: 工作规划与议题管理
  type: FOLDER
  dependencies:
  - REQ-3-3
  description: 支持在当前仓库内发现、创建、讨论、分类和变更议题状态。议题必须保存仓库归属、编号、标题、描述、作者、打开/关闭状态、参与者、标签、里程碑、评论和活动时间线；列表、详情、编辑和分类操作都围绕同一议题标识工作。议题状态和元数据变化应立即反映在详情页与筛选列表中，重新打开仓库后仍保持。 此功能建立在 REQ-3-3（查看公共仓库概览） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
  children:
  - id: REQ-5-1
    name: 议题发现与详情
    type: FOLDER
    dependencies:
    - REQ-3-3
    description: 支持从仓库的议题列表按状态、标题/正文关键词和基础元数据查找议题，并打开详情页查看完整内容和活动。筛选只影响当前列表显示，不删除或改写议题；详情页是编辑、评论、分配、打标签、归入里程碑和关闭/重开操作的共同上下文。 此功能建立在 REQ-3-3（查看公共仓库概览） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-5-1-1
      name: 列出并筛选仓库议题
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >-
        此功能建立在 REQ-3-3（查看公共仓库概览） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        仓库参与者可列出议题，按打开或关闭状态筛选，按议题元数据搜索，并打开相关工作项列表进行分诊。


        截图参考：

        ![image](reference/github-issues-list.png)
      scenarios:
      - name: 列出并筛选仓库议题
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 用户在仓库“Issues”页选择 Open/Closed 状态、输入关键词或选择标签等筛选条件。
        - keyword: THEN
          content: 仓库参与者可列出议题，按打开或关闭状态筛选，按议题元数据搜索，并打开相关工作项列表进行分诊。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
      - name: 仅筛选关闭状态的议题
        steps:
        - keyword: GIVEN
          content: 仓库参与者正在查看同时包含打开和关闭议题的列表。
        - keyword: WHEN
          content: 参与者切换到关闭状态筛选并搜索一个已关闭议题标题。
        - keyword: THEN
          content: 系统只显示匹配的已关闭议题，并在重新加载后保持议题数据不变。
    - id: REQ-5-1-2
      name: 查看议题及其讨论
      type: ATOMIC
      dependencies:
      - REQ-5-1-1
      description: 仓库参与者可打开议题，阅读其标题、描述、状态、元数据、评论和活动时间线，再决定采取何种操作。 此功能建立在 REQ-5-1-1（列出并筛选仓库议题） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      scenarios:
      - name: 查看议题及其讨论
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 用户在议题列表点击目标议题编号或标题，打开详情页并查看讨论时间线。
        - keyword: THEN
          content: 仓库参与者可打开议题，阅读其标题、描述、状态、元数据、评论和活动时间线，再决定采取何种操作。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
  - id: REQ-5-2
    name: 议题创建与讨论
    type: FOLDER
    dependencies:
    - REQ-5-1-2
    description: 支持在当前仓库创建议题、编辑标题与描述、追加讨论评论。议题标题为 1–256 个去除首尾空白后非空字符，描述可为空且最多 65536 个字符；评论为 1–65536 个去除首尾空白后非空字符。创建成功后为议题分配仓库内唯一编号并进入详情页；编辑只能改变目标议题当前字段，评论作为带作者和时间的独立记录追加到活动时间线。无权限、空必填字段、超长输入或写入失败时不得创建空议题、覆盖原描述或追加部分评论。 此功能建立在 REQ-5-1-2（查看议题及其讨论） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-5-2-1
      name: 创建仓库议题
      type: ATOMIC
      dependencies:
      - REQ-3-3
      - REQ-1-1-2
      description: >-
        此功能建立在 REQ-3-3（查看公共仓库概览）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        已登录用户从当前仓库的议题列表或相关上下文打开创建表单，填写非空标题、可选描述并提交。系统验证该用户对仓库的议题写权限，分配仓库内递增且唯一的议题编号，保存仓库标识、标题、描述、作者、创建时间和打开状态，并记录创建活动；失败时不分配可见议题或写入部分元数据。成功后跳转到新议题详情页，列表可按新编号和状态找到该议题。


        截图参考：

        ![image](reference/github-new-issue.png)
      scenarios:
      - name: 从仓库、评论、代码、讨论或项目上下文创建议题
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: 用户在仓库“Issues”页点击“New issue”，填写非空标题和可选描述后点击“Submit new issue”。
        - keyword: THEN
          content: 新对象或关系会被保存，并出现在相关 GitHub 上下文中。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-5-2-2
      name: 编辑议题标题和描述
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: 已登录用户可在仓库规划和议题管理页面使用此能力。 此能力要求用户已通过身份验证，并有权访问相关账户、仓库或组织。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统显示可观察的结果，并保留变更后的状态以供后续使用。 此功能建立在 REQ-5-1-2（查看议题及其讨论） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。 具备编辑权限的用户在议题详情页点击标题或描述旁的“Edit”，修改对应文本后点击“Save”。 系统只更新目标议题的标题或描述，并在详情、列表摘要和活动时间线中显示新值；空标题或保存失败时保留原值。
      scenarios:
      - name: 编辑议题标题和描述
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: 具备编辑权限的用户在议题详情页点击标题或描述旁的“Edit”，修改对应文本后点击“Save”。
        - keyword: THEN
          content: 系统只更新目标议题的标题或描述，并在详情、列表摘要和活动时间线中显示新值；空标题或保存失败时保留原值。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: 拒绝空白议题标题更新
        steps:
        - keyword: GIVEN
          content: 具备编辑权限的用户打开一个可编辑标题的议题详情页。
        - keyword: WHEN
          content: 用户把标题清空成空白值并尝试保存。
        - keyword: THEN
          content: 系统拒绝保存，保留原标题，并在重新加载后继续显示原标题。
    - id: REQ-5-2-3
      name: 评论议题讨论
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      - REQ-1-1-2
      description: 已登录用户在当前仓库的议题详情页输入非空评论；如界面提供反应，也可对既有议题或评论添加或移除自己的反应。系统验证对目标议题的评论权限，保存评论标识、议题标识、作者、正文和创建时间，或保存“主体—目标—反应类型”关联；同一用户对同一目标的同一反应不得重复。成功后将新评论或反应显示在讨论与活动时间线中；失败时不显示本地伪评论或部分反应。 此功能建立在 REQ-5-1-2（查看议题及其讨论）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      scenarios:
      - name: 评论议题讨论并添加反应
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: 用户在议题详情的评论框输入评论，点击“Comment”发布，或使用反应按钮选择/取消反应。
        - keyword: THEN
          content: 系统显示可观察的结果，并保留变更后的状态以供后续使用。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: 拒绝空白议题评论
        steps:
        - keyword: GIVEN
          content: 用户打开议题讨论页，且评论框和提交按钮可见。
        - keyword: WHEN
          content: 用户在评论框中只输入空白字符并尝试提交。
        - keyword: THEN
          content: 系统不会创建新的评论或时间线记录，并且重新加载后讨论数量保持不变。
  - id: REQ-5-3
    name: 议题元数据与分类
    type: FOLDER
    dependencies:
    - REQ-5-1-2
    description: 支持在议题详情页管理参与者、标签和里程碑。参与者必须是可分配到该仓库的用户；标签和里程碑必须属于当前仓库。每次增删关联都应更新议题元数据和活动记录，不得自动创建跨仓库标签、里程碑或成员关系。 此功能建立在 REQ-5-1-2（查看议题及其讨论） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-5-3-1
      name: 分配或取消分配议题参与者
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: 已登录用户可在账户访问页面使用此能力。 此能力要求用户已通过身份验证，并有权访问相关账户、仓库或组织。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 更新后的配置、关系或状态会被保存，并在对象重新打开时继续生效。 此功能建立在 REQ-5-1-2（查看议题及其讨论） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。 用户在议题右侧“Assignees”区域点击设置图标，搜索并勾选可分配成员，或取消已选成员后关闭菜单。 系统保存新的参与者集合并记录活动；不可分配用户不会出现在可选结果中，取消分配不删除成员账户。
      scenarios:
      - name: 分配或取消分配议题参与者
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: 用户在议题右侧“Assignees”区域点击设置图标，搜索并勾选可分配成员，或取消已选成员后关闭菜单。
        - keyword: THEN
          content: 系统保存新的参与者集合并记录活动；不可分配用户不会出现在可选结果中，取消分配不删除成员账户。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-5-3-2
      name: 为议题应用标签
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: 具有适当权限的仓库参与者可应用或移除标签，使议题能够按仓库的基础标签集分类。 此功能建立在 REQ-5-1-2（查看议题及其讨论） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      scenarios:
      - name: 为议题应用标签
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 用户在议题详情右侧“Labels”区域打开选择器，勾选或取消当前仓库已有标签。
        - keyword: THEN
          content: 具有适当权限的仓库参与者可应用或移除标签，使议题能够按仓库的基础标签集分类。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
    - id: REQ-5-3-3
      name: 将议题和拉取请求归入里程碑
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: >-
        用户在议题或拉取请求右侧“Milestone”区域点击设置图标，从当前仓库的里程碑列表选择一项，或选择“None”移除。 系统保存该工作项与里程碑的关联并更新详情元数据；不会创建跨仓库里程碑。
        此功能建立在 REQ-5-1-2（查看议题及其讨论） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        仓库协作者可在仓库规划和议题管理页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的仓库协作权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统显示可观察的结果，并保留变更后的状态以供后续使用。


        截图参考：

        ![image](reference/github-milestones.png)
      scenarios:
      - name: 将议题和拉取请求归入里程碑
        steps:
        - keyword: GIVEN
          content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: 用户在议题或拉取请求右侧“Milestone”区域点击设置图标，从当前仓库的里程碑列表选择一项，或选择“None”移除。
        - keyword: THEN
          content: 系统保存该工作项与里程碑的关联并更新详情元数据；不会创建跨仓库里程碑。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-5-4
    name: 关闭或重新打开议题
    type: ATOMIC
    dependencies:
    - REQ-5-1-2
    description: 具有足够权限的仓库参与者可从议题详情视图关闭或重新打开议题。 系统验证请求的状态变更，在议题活动历史中记录该转换，并向后续查看者显示更新后的议题状态。 此功能建立在 REQ-5-1-2（查看议题及其讨论） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    scenarios:
    - name: 关闭或重新打开议题
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
      - keyword: WHEN
        content: 用户在议题详情页点击“Close issue”关闭，或在已关闭议题页点击“Reopen issue”重新打开。
      - keyword: THEN
        content: 议题变为所选状态，且该转换会显示在其活动历史中。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - name: 阻止没有议题管理权限的用户关闭议题
      steps:
      - keyword: GIVEN
        content: 一个只能查看议题、但没有议题管理权限的已登录用户打开议题详情页。
      - keyword: WHEN
        content: 该用户尝试关闭或重新打开议题。
      - keyword: THEN
        content: 关闭和重新打开操作对该用户不可用或被拒绝，且议题状态保持不变。
- id: REQ-6
  name: 变更评审与合并控制
  type: FOLDER
  dependencies:
  - REQ-3-3
  - REQ-4-3
  description: 支持从仓库分支比较创建拉取请求，并围绕同一拉取请求完成评审、审查、合并或关闭。拉取请求必须保存仓库归属、唯一编号、源/目标分支与其创建时提交基线、标题/描述、草稿/打开/关闭/已合并状态、评论、评审请求、评审决定和合并结果。分支保护规则在合并前统一检查；读取、评论、评审、请求评审和合并均验证仓库角色。状态变更必须写入活动时间线，失败不能改变分支内容或拉取请求状态。 此功能建立在 REQ-3-3（查看公共仓库概览）、REQ-4-3（分支与标签管理） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
  children:
  - id: REQ-6-1
    name: 使用评审和状态检查要求保护分支
    type: ATOMIC
    dependencies:
    - REQ-4-3-1
    - REQ-1-1-2
    description: >-
      此功能建立在 REQ-4-3-1（列出并切换仓库分支）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      仓库管理员可通过要求评审或状态条件，在变更集成前保护重要分支。 系统保存保护规则，防止对受保护分支进行未经授权的变更，并在后续拉取请求合并时应用该规则。


      截图参考：

      ![image](reference/github-branch-protection.png)
    scenarios:
    - name: 使用评审和状态检查要求保护分支
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
      - keyword: WHEN
        content: 管理员在仓库“Settings”→“Branches”点击“Add branch protection rule”，输入分支模式、选择评审/状态检查要求后点击“Create”或“Save changes”。
      - keyword: THEN
        content: 分支保护规则会被保存，并针对后续对受保护分支的变更强制执行。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - name: 阻止非管理员修改分支保护规则
      steps:
      - keyword: GIVEN
        content: 一个没有仓库管理权限的已登录用户打开分支保护设置页。
      - keyword: WHEN
        content: 该用户尝试创建或修改一条分支保护规则。
      - keyword: THEN
        content: 对非管理员来说分支保护控件不可用或被拒绝，且不会保存任何保护规则。
  - id: REQ-6-2
    name: 拉取请求发现与创建
    type: FOLDER
    dependencies:
    - REQ-4-3
    description: 支持在当前仓库列出和筛选拉取请求、选择源/目标分支查看比较结果，并基于有效比较创建普通或草稿拉取请求。比较结果为创建页的临时只读上下文；创建成功后持久化源/目标分支、当前比较提交、标题、描述、作者和状态，并进入新拉取请求详情页。源与目标相同、无可比较提交或无创建权限时必须拒绝创建且不留下部分记录。 此功能建立在 REQ-4-3（分支与标签管理） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-6-2-1
      name: 列出并筛选仓库拉取请求
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >-
        此功能建立在 REQ-3-3（查看公共仓库概览） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        仓库参与者可列出拉取请求，并按状态或评审相关元数据筛选列表，以找到需要关注的提案。


        截图参考：

        ![image](reference/github-pull-requests-list.png)
      scenarios:
      - name: 列出并筛选仓库拉取请求
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 用户在仓库“Pull requests”页选择 Open/Closed 状态、作者、标签或评审筛选条件。
        - keyword: THEN
          content: 仓库参与者可列出拉取请求，并按状态或评审相关元数据筛选列表，以找到需要关注的提案。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
    - id: REQ-6-2-2
      name: 在打开拉取请求前比较分支
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >-
        协作者在“Pull requests”页点击“New pull request”，依次选择 base 分支和 compare 分支，再点击“Compare changes”。 系统显示可比较的提交数、已更改文件和差异摘要；分支相同或没有差异时禁用创建入口并说明原因。
        此功能建立在 REQ-4-3-1（列出并切换仓库分支）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
        仓库协作者可在仓库拉取请求页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的仓库协作权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统显示可观察的结果，并保留变更后的状态以供后续使用。


        截图参考：

        ![image](reference/github-compare-branches.png)
      scenarios:
      - name: 在打开拉取请求前比较分支
        steps:
        - keyword: GIVEN
          content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: 协作者在“Pull requests”页点击“New pull request”，依次选择 base 分支和 compare 分支，再点击“Compare changes”。
        - keyword: THEN
          content: 系统显示可比较的提交数、已更改文件和差异摘要；分支相同或没有差异时禁用创建入口并说明原因。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: base 和 compare 分支相同时禁用拉取请求创建
        steps:
        - keyword: GIVEN
          content: 协作者在可选择 base 分支和 compare 分支的比较页面中打开比较视图。
        - keyword: WHEN
          content: 协作者把 base 和 compare 都选成同一个分支并点击 Compare changes。
        - keyword: THEN
          content: 系统说明两个分支相同或没有差异，并保持拉取请求创建入口处于禁用状态。
    - id: REQ-6-2-3
      name: 基于比较结果创建拉取请求
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: 仓库协作者可在仓库拉取请求页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的仓库协作权限。系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。新对象或关系会被保存，并出现在相关 GitHub 上下文中。此功能建立在 REQ-6-2-2（在打开拉取请求前比较分支）提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。用户在有效比较结果页点击“Create pull request”，输入 1–256 个去除首尾空白后非空字符的标题、最多 65536 个字符的可选描述，确认不同且存在差异的 base/compare 分支后点击“Create pull request”。系统创建打开状态的拉取请求、分配仓库内编号并跳转到详情页；无差异、分支相同、标题为空或超长、或提交失败时不创建记录。
      scenarios:
      - name: 基于比较结果创建拉取请求
        steps:
        - keyword: GIVEN
          content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: 用户在有效比较结果页点击“Create pull request”，输入非空标题、可选描述，确认 base/compare 分支后点击“Create pull request”。
        - keyword: THEN
          content: 系统创建打开状态的拉取请求、分配仓库内编号并跳转到详情页；无差异、标题为空或提交失败时不创建记录。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-6-2-4
      name: 创建草稿拉取请求
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: 仓库协作者可在仓库拉取请求页面使用此能力。 此能力要求用户已通过身份验证，并具有所需的仓库协作权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 新对象或关系会被保存，并出现在相关 GitHub 上下文中。 此功能建立在 REQ-6-2-2（在打开拉取请求前比较分支） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。 用户完成 base/compare 分支选择后点击“Create draft pull request”，输入标题和可选描述并确认创建。 系统创建草稿状态的拉取请求并显示“Draft”标识；草稿不可在满足条件前合并。
      scenarios:
      - name: 创建草稿拉取请求
        steps:
        - keyword: GIVEN
          content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: 用户完成 base/compare 分支选择后点击“Create draft pull request”，输入标题和可选描述并确认创建。
        - keyword: THEN
          content: 系统创建草稿状态的拉取请求并显示“Draft”标识；草稿不可在满足条件前合并。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-6-3
    name: 拉取请求评审工作区
    type: FOLDER
    dependencies:
    - REQ-6-2-3
    description: 支持在拉取请求详情页查看概览、提交、已更改文件和差异，并在差异的具体文件与行范围上添加评审评论或提交评审决定。行级评论必须保存目标拉取请求、提交/差异上下文、文件路径、行位置、作者和正文；评审决定必须保存评审者、状态和说明，并更新详情页及合并资格检查所使用的评审状态。查看操作只读，评论或评审提交失败时不得显示为已发布。 此功能建立在 REQ-6-2-3（基于比较结果创建拉取请求） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    children:
    - id: REQ-6-3-1
      name: 查看拉取请求概览和提交
      type: ATOMIC
      dependencies:
      - REQ-6-2-3
      description: 评审者可打开拉取请求，在评审拟议变更之前了解其标题、分支、对话、包含的提交和合并上下文。 此功能建立在 REQ-6-2-3（基于比较结果创建拉取请求） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      scenarios:
      - name: 查看拉取请求概览和提交
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 评审者在拉取请求列表点击目标编号或标题，使用详情页的 Conversation、Commits 和 Files changed 标签查看信息。
        - keyword: THEN
          content: 评审者可打开拉取请求，在评审拟议变更之前了解其标题、分支、对话、包含的提交和合并上下文。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
    - id: REQ-6-3-2
      name: 检查已更改文件和汇总差异
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      description: 访客或已登录用户可在仓库代码和版本控制页面使用此能力。 此能力要求目标公共对象可用，或用户具有查看权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 所请求的信息会显示出来，并向用户展示相关筛选器、元数据或状态指示器。 此功能建立在 REQ-6-3-1（查看拉取请求概览和提交） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。 评审者在拉取请求详情页点击“Files changed”，从文件列表选择文件并展开差异块，使用文件导航查看增删行。 系统按当前拉取请求的源/目标提交显示文件路径、增加/删除行和汇总统计；查看不改变文件或评审状态。
      scenarios:
      - name: 检查已更改文件和汇总差异
        steps:
        - keyword: GIVEN
          content: Visitor or authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: 评审者在拉取请求详情页点击“Files changed”，从文件列表选择文件并展开差异块，使用文件导航查看增删行。
        - keyword: THEN
          content: 系统按当前拉取请求的源/目标提交显示文件路径、增加/删除行和汇总统计；查看不改变文件或评审状态。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - id: REQ-6-3-3
      name: 向已更改的代码行添加评审评论
      type: ATOMIC
      dependencies:
      - REQ-6-3-2
      - REQ-1-1-2
      description: 已登录用户可在仓库拉取请求页面使用此能力。 此能力要求目标公共对象可用，或用户具有查看权限。 系统验证资格，显示任何所需警告或不可用状态，并防止未经授权的变更。 系统显示可观察的结果，并保留变更后的状态以供后续使用。 此功能建立在 REQ-6-3-2（检查已更改文件和汇总差异）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。 评审者在“Files changed”中悬停目标新增或删除行并点击“+”，输入评论后选择“Add single comment”或“Start a review”。 系统将评论关联到拉取请求、文件路径、差异提交和行位置；开始评审时评论处于待提交状态，单条评论立即出现在讨论中。
      scenarios:
      - name: 向已更改的代码行添加评审评论
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: 评审者在“Files changed”中悬停目标新增或删除行并点击“+”，输入评论后选择“Add single comment”或“Start a review”。
        - keyword: THEN
          content: 系统将评论关联到拉取请求、文件路径、差异提交和行位置；开始评审时评论处于待提交状态，单条评论立即出现在讨论中。
        - keyword: THEN
          content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
      - name: 开始评审时让行内评论保持待提交状态
        steps:
        - keyword: GIVEN
          content: 评审者在拉取请求的 Files changed 视图中定位到一条变更行。
        - keyword: WHEN
          content: 评审者输入行内评论并选择 Start a review 而不是 Add single comment。
        - keyword: THEN
          content: 系统保持该评论为待提交状态，不会立即发布，并且只有在评审提交后才显示。
    - id: REQ-6-3-4
      name: 提交拉取请求评审
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      - REQ-1-1-2
      description: 评审者可请求评审、对提案发表评论、批准提案或请求变更。 系统记录评审决定，以便作者和维护者采取相应行动。 此功能建立在 REQ-6-3-1（查看拉取请求概览和提交）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
      scenarios:
      - name: 提交拉取请求评审
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: 评审者在拉取请求“Files changed”页点击“Review changes”，输入可选总体评论，选择 Comment、Approve 或 Request changes 后点击“Submit review”。
        - keyword: THEN
          content: 系统记录评审决定，以便作者和维护者采取相应行动。
        - keyword: THEN
          content: 当对象再次打开时，可见状态保持一致。
      - name: 记录请求修改的评审决定
        steps:
        - keyword: GIVEN
          content: 评审者打开一个可以评审的拉取请求。
        - keyword: WHEN
          content: 评审者输入评审意见，选择 Request changes，并提交评审。
        - keyword: THEN
          content: 系统保存评审评论和 changes requested 状态，并在重新加载后继续显示该决定。
  - id: REQ-6-4
    name: 请求或移除拉取请求评审者
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: 拉取请求作者或维护者可为拉取请求请求评审者，或移除评审者请求。 系统验证仓库权限，更新评审分配状态，并在拉取请求中显示当前请求的评审者。 此功能建立在 REQ-6-2-3（基于比较结果创建拉取请求）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    scenarios:
    - name: 请求或移除拉取请求评审者
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
      - keyword: WHEN
        content: 作者或维护者在拉取请求右侧“Reviewers”区域搜索并选择评审者，或点击已请求评审者旁的移除按钮。
      - keyword: THEN
        content: 拉取请求显示更新后的评审者请求状态。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-6-5
    name: 合并符合条件的拉取请求
    type: ATOMIC
    dependencies:
    - REQ-6-3-4
    - REQ-6-1
    description: 授权维护者在打开的非草稿拉取请求详情页选择合并方式并确认。系统验证维护者角色、拉取请求仍可合并、源/目标分支状态、所需评审以及分支保护规则；任一条件不满足时合并入口禁用或拒绝操作并显示原因。通过后创建目标分支上的合并结果提交或按所选方式更新提交历史，原子更新目标分支头，并保存拉取请求的已合并状态、合并人、时间和结果提交标识。任一条件不满足或写入失败时，不改变目标分支和拉取请求状态。 此功能建立在 REQ-6-3-4（提交拉取请求评审）、REQ-6-1（使用评审和状态检查要求保护分支） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    scenarios:
    - name: 合并符合条件的拉取请求
      steps:
      - keyword: GIVEN
        content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
      - keyword: WHEN
        content: 维护者在满足条件的拉取请求页选择合并方式，点击“Merge pull request”并在确认框中点击“Confirm merge”。
      - keyword: THEN
        content: 已批准的变更会根据所选合并策略被集成，拉取请求会显示结果状态。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
  - id: REQ-6-6
    name: 不合并地关闭或重新打开拉取请求
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: 当拟议变更不应继续推进时，拉取请求作者或维护者可不合并地关闭拉取请求；当工作应继续时，可重新打开它。 系统记录状态转换，并根据仓库权限保持拉取请求讨论和拟议变更可用。 此功能建立在 REQ-6-2-3（基于比较结果创建拉取请求）、REQ-1-1-2（使用现有账户登录） 提供的已保存对象、已打开页面或已认证会话上下文之上；应复用该上下文并在其变更后保持页面与数据一致。
    scenarios:
    - name: 不合并地关闭或重新打开拉取请求
      steps:
      - keyword: GIVEN
        content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
      - keyword: WHEN
        content: 作者或维护者在打开的拉取请求页点击“Close pull request”，或在已关闭页面点击“Reopen pull request”。
      - keyword: THEN
        content: 拉取请求变为所选状态，且该转换会显示在其活动历史中。
      - keyword: THEN
        content: 当再次打开时，可见的 GitHub 页面或对象会反映最终状态。
    - name: 阻止非作者且非维护者关闭拉取请求
      steps:
      - keyword: GIVEN
        content: 一个既不是拉取请求作者也不是维护者的已登录查看者打开受保护的拉取请求。
      - keyword: WHEN
        content: 该查看者尝试查找关闭或重新打开操作，或者尝试修改拉取请求状态。
      - keyword: THEN
        content: 关闭和重新打开操作对该用户不可用或被拒绝，且拉取请求状态保持不变。
data:
- category: 账户与权限预置数据
  items:
  - 系统中存在已验证账户，可用于通过用户名或已验证邮箱登录、通过已验证邮箱恢复访问、修改密码，以及从受保护页面退出登录。
  - 系统中存在具备组织所有者、组织非所有者、团队维护者、仓库所有者、仓库管理员、非管理员协作者、查看者、分支贡献者、文件贡献者、议题作者、议题编辑者、议题评论者、议题查看者、拉取请求作者、拉取请求维护者、拉取请求评审者和拉取请求贡献者角色的已验证账户。
  - 系统中存在受保护的账户、组织、仓库、议题和拉取请求页面，用于验证退出登录后直接打开时必须重新认证。
- category: 组织与仓库预置数据
  items:
  - 系统中存在一个公共组织，其中至少有一个访客可见的公开仓库，以及至少一个对无权限访客不可见的私有仓库。
  - 系统中存在一个可由组织所有者管理的组织，并包含成员、邀请候选人、待处理邀请人、可移除成员、团队、团队候选成员，以及适合验证成员关系和层级关系的嵌套团队。
  - 系统中存在名称不同的公开仓库和私有仓库，用于仓库搜索、公开仓库查看、复制克隆 URL 和可见性筛选。
  - 系统中存在由预置账户管理的仓库，用于访问授权、角色变更、可见性变更、默认分支变更、分支保护、文件变更和拉取请求流程。
  - 系统中存在一个可由预置用户 fork 的源仓库，并且存在一个可被识别为已经创建的 fork。
- category: 代码、分支与提交预置数据
  items:
  - 系统中存在一个代码仓库，包含可浏览目录、已知文件名、可见文件内容、可搜索代码文本，以及会返回空结果的搜索词。
  - 系统中存在一个仓库的提交历史，其中至少包含一条可见提交消息和提交作者。
  - 系统中存在一个提交详情页，包含已变更文件和足够用于检查新增行、删除行的差异内容。
  - 系统中存在一个分支仓库，包含当前活动分支、另一个可切换分支、仅存在于目标分支的文件，以及一个无法匹配任何分支的查询词。
  - 系统中存在一个包含旧默认分支和新默认分支候选项的仓库，管理员可修改默认分支，非管理员不可修改。
  - 系统中存在一个分支保护仓库和分支名模式，管理员可配置保护规则，非管理员不可修改。
- category: 议题预置数据
  items:
  - 系统中存在一个议题列表，至少包含一个打开状态议题标题和一个关闭状态议题标题，用于筛选。
  - 系统中存在一个议题详情页，其中稳定显示标题和描述，访客或授权用户可查看。
  - 系统中存在可编辑、非法编辑校验、可评论、评论校验、可分配、可打标签、可设置里程碑、可关闭，以及受保护的议题，用于议题编辑、评论、元数据和状态流转测试。
  - 系统中存在可从相关议题控件中选择的议题负责人、标签和里程碑。
- category: 拉取请求预置数据
  items:
  - 系统中存在一个拉取请求列表，至少包含一个打开状态拉取请求标题，用于筛选。
  - 系统中存在可用于创建拉取请求的分支比较数据，包括有效的 base 分支、compare 分支、已变更文件、无差异比较、普通 compare URL 和草稿 compare URL。
  - 系统中存在用于概览查看、公开变更文件检查、行内评审评论、待提交评审评论、提交评审、提交 request changes 评审、分配评审者、合并、不可合并校验、关闭或重新打开，以及受保护关闭/重新打开权限校验的拉取请求详情页。
  - 系统中存在可用于拉取请求评审者请求测试的评审者用户名。
