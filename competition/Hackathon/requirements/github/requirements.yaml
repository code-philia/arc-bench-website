  - id: REQ-4-3
    name: Branch and Tag Management
    type: FOLDER
    dependencies:
    - REQ-4-1
    description: Core branch listing, switching and creation capabilities. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-1 (Browse repository files and directories); it must reuse that context and remain consistent when the prerequisite state changes.
    children:
    - id: REQ-4-3-1
      name: List and switch repository branches
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-1 (Browse repository files and directories); it must reuse that context and remain consistent when the prerequisite state changes.
        A repository participant lists available branches, identifies the active branch and switches repository context to another branch for browsing or editing.

        Screenshot reference: ![image](reference/github-branch-selector.png)
      scenarios:
      - name: List and switch repository branches
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: The user completes the workflow to list and switch repository branches.
        - keyword: THEN
          content: A repository participant lists available branches, identifies the active branch and switches repository context to another branch for browsing or editing.
        - keyword: THEN
          content: The visible state remains consistent when the object is opened again.
      - name: Keep the current branch when no search result matches
        steps:
        - keyword: GIVEN
          content: A repository participant opens the branch selector on a repository page with an active branch already selected.
        - keyword: WHEN
          content: The participant types a branch query that has no matches.
        - keyword: THEN
          content: The system shows an empty branch search state and keeps the current active branch selected after the selector is closed or the page is reloaded.
    - id: REQ-4-3-2
      name: Create a branch from an existing revision
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >
        The user opens the branch selector, enters a new branch name, confirms the displayed base branch or commit, and clicks “Create branch: <name>”. The system creates a branch pointing to that base commit and switches the selector to it; existing names or missing permission create nothing.
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-3-1 (List and switch repository branches), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
        An authenticated user uses this capability from repository code and version-control pages. The capability requires that the user is authenticated and has the required repository collaboration permission. The user completes the main choices or confirmation steps for create a branch from an existing revision. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The new object or relationship is saved and appears in the relevant GitHub context.

        Screenshot reference: ![image](reference/github-create-branch.png)
      scenarios:
      - name: Create a branch from an existing revision
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: The user opens the branch selector, enters a new branch name, confirms the displayed base branch or commit, and clicks the create-branch button.
        - keyword: THEN
          content: The system creates a branch pointing to that base commit and switches the selector to it; existing names or missing permission create nothing.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-4-3-3
      name: Change the repository default branch
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >
        The administrator opens “Settings” → “Branches”, chooses an existing branch in “Default branch”, clicks “Update”, and confirms the change. The system saves the new default branch for new repository visits without deleting or rewriting the former default branch.
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-3-1 (List and switch repository branches), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
        An authenticated user uses this capability from repository code and version-control pages. The capability requires that the user is authenticated and has the required repository collaboration permission. The user completes the main choices or confirmation steps for change the repository default branch. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The updated configuration, relationship or state is saved and remains effective when the object is reopened.

        Screenshot reference: ![image](reference/github-default-branch-settings.png)
      scenarios:
      - name: Change the repository default branch
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: The administrator opens “Settings” → “Branches”, chooses an existing branch in “Default branch”, clicks “Update”, and confirms the change.
        - keyword: THEN
          content: The system saves the new default branch for new repository visits without deleting or rewriting the former default branch.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
      - name: Block non-admin changes to the default branch
        steps:
        - keyword: GIVEN
          content: A signed-in user without repository administration permission opens the repository settings branch page.
        - keyword: WHEN
          content: The user inspects the default branch controls or attempts to update the setting.
        - keyword: THEN
          content: The default branch update action is unavailable or rejected for the non-admin, and the saved default branch remains unchanged.
  - id: REQ-4-4
    name: Manage repository files through the web interface
    type: ATOMIC
    dependencies:
    - REQ-4-1
    - REQ-1-1-2
    description: >
      This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-1 (Browse repository files and directories), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
      A repository contributor creates, edits, uploads, renames or removes repository files from the web interface when they have permission to change the selected branch. The system validates the change and saves the resulting file updates as repository commits.

      Screenshot reference: ![image](reference/github-web-file-editor.png)
    scenarios:
    - name: Manage repository files through the web interface
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: The user completes the workflow to manage repository files through the web interface.
      - keyword: THEN
