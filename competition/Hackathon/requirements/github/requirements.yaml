    - id: REQ-4-2-3
      name: Search code within a repository scope
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >
        The user enters a code keyword in the repository search box, presses Enter, selects the “Code” result page, optionally filters by path or language, and clicks a match. The system shows matching snippets, paths, and branch/revision context within code visible in the current repository, then opens the selected file location.
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-1 (Browse repository files and directories); it must reuse that context and remain consistent when the prerequisite state changes.
        A visitor or authenticated user uses this capability from repository code and version-control pages. The capability requires that the target public object is available or the user has permission to view it. The user completes the main choices or confirmation steps for search code within a repository scope. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The requested information is displayed with the relevant filters, metadata or status indicators visible to the user.

        Screenshot reference: ![image](reference/github-repository-code-search.png)
      scenarios:
      - name: Search code within a repository scope
        steps:
        - keyword: GIVEN
          content: Visitor or authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: The user enters a code keyword in the repository search box, presses Enter, selects the “Code” result page, optionally filters by path or language, and clicks a match.
        - keyword: THEN
          content: The system shows matching snippets, paths, and branch/revision context within code visible in the current repository, then opens the selected file location.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
      - name: Show an empty state when code search has no matches
        steps:
        - keyword: GIVEN
          content: A user is on a repository code search page with repository scope already selected.
        - keyword: WHEN
          content: The user enters a code query that returns no matches and opens the Code results view.
