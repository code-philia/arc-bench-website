id: ROOT
name: GitHub Collaboration Platform Core Requirements
type: FOLDER
dependencies: []
description: A compact GitHub-style collaboration platform focused on account access, organizations and members, repositories and Git content, issues, pull requests, and basic access control. Users enter as visitors or through authenticated sessions; every write runs in a specific account, organization, repository, branch, or work-item context. Persist accounts and sessions, organization members and teams, repositories with visibility and access roles, branches and commits, file content, issues and comments, and pull requests with review and merge state. On reopen, restore the last successfully saved state. Every write must verify the current identity and resource permission, report failures, and avoid partial objects or partial state changes. Real-time collaboration, Actions, Packages, Wiki, project boards, notification delivery, and external Git remote protocols are outside the core scope.
children:
- id: REQ-1
  name: Identity and Access
  type: FOLDER
  dependencies: []
  description: Manages the lifecycle from visitor to authenticated user. Accounts have a unique login name and a verified email identifier; full passwords must never be shown in the interface, recovery flow, or visible logs. A successful sign-in creates a revocable web session used for later authorization. Unless a child requirement states otherwise, a username is 1–39 lowercase ASCII letters, digits, or single hyphens and cannot start or end with a hyphen; a password is 12–128 characters, contains at least one uppercase letter, lowercase letter, digit, and non-alphanumeric special character, and contains no whitespace.
  children:
  - id: REQ-1-1
    name: Account Onboarding and Recovery
    type: FOLDER
    dependencies: []
    description: Capabilities required for visitors to create, recover and access accounts. Registration, sign-in, and recovery use visibly labelled fields and actions; failures retain non-sensitive input but never echo submitted password values.
    children:
    - id: REQ-1-1-1
      name: Register a new GitHub account
      type: ATOMIC
      dependencies: []
      description: >
        The visitor clicks “Sign up”, enters a unique username, email, password, and password confirmation, accepts the terms, and clicks “Create account”. The username follows the REQ-1 format rule. After surrounding whitespace is removed, email contains exactly one `@`, is at most 254 characters, and has a non-empty domain containing a dot with non-empty labels. Password follows the REQ-1 password rule and confirmation matches character-for-character. The system creates a pending-verification account and shows the email-verification prompt. Duplicate usernames/emails, missing fields, malformed email, missing terms acceptance, invalid password, or mismatched confirmation retain username and email, show a field-level reason, and neither create an account nor start verification.
        A visitor uses this capability from account access pages. The capability requires that the visitor can provide the required account information. The user completes the main choices or confirmation steps for register a new github account. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The system creates or begins verification for the new account and makes the account available after required checks are complete.

        Screenshot reference: ![image](reference/github-sign-up.png)
      scenarios:
      - name: Register a new GitHub account
        steps:
        - keyword: GIVEN
          content: Visitor is in the relevant GitHub context, and the visitor can provide the required account information.
        - keyword: WHEN
          content: The visitor clicks “Sign up”, enters a unique username, email, password, and password confirmation, accepts the terms, and clicks “Create account”.
        - keyword: THEN
          content: The system creates a pending-verification account and shows the email-verification prompt; duplicate usernames/emails or invalid passwords keep the form and show field errors.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-1-1-2
      name: Sign in with an existing account
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: >
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-1 (Register a new GitHub account); it must reuse that context and remain consistent when the prerequisite state changes.
        A visitor signs in from an account access page with either a login name or verified email and a password. Unknown login/email, wrong password, unverified account, and unavailable account display exactly the same generic failure message and create no session. Success creates an authenticated session, opens the user's workspace, and remains authenticated after refresh or reopening the workspace.

        Screenshot reference: ![image](reference/github-sign-in.png)
      scenarios:
      - name: Sign in with an existing account
        steps:
        - keyword: GIVEN
          content: Visitor is in the relevant GitHub context, and the visitor has an existing account and valid credentials.
        - keyword: WHEN
          content: The user completes the workflow to sign in with an existing account.
        - keyword: THEN
          content: The system starts an authenticated session and shows the signed-in user's workspace.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-1-1-3
      name: Recover account access by verified email
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: >
        The visitor clicks “Forgot password”, enters an email, clicks “Send reset link”, and uses a delivered reset link to enter and confirm a new password. Known and unknown email addresses show exactly the same generic delivery result. A link is created only for a verified email, is bound to that account, expires 30 minutes after issue, and can succeed only once. Credentials update only when the link is valid, unexpired, unused, and the new password follows REQ-1 and matches its confirmation; every other outcome leaves credentials unchanged.
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-1 (Register a new GitHub account); it must reuse that context and remain consistent when the prerequisite state changes.
        A visitor uses this capability from account access pages. The capability requires that the visitor can identify a verified account email address. The user completes the main choices or confirmation steps for recover account access by verified email. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The system accepts the recovery request and provides the next account-recovery step without exposing account secrets.

        Screenshot reference: ![image](reference/github-password-reset.png)
      scenarios:
      - name: Recover account access by verified email
        steps:
        - keyword: GIVEN
          content: Visitor is in the relevant GitHub context, and the visitor can identify a verified account email address.
        - keyword: WHEN
          content: The visitor clicks “Forgot password”, enters a verified email, clicks “Send reset link”, and uses the delivered reset link to enter and confirm a new password.
        - keyword: THEN
          content: The system shows only a generic delivery result; it updates credentials only when the link is valid and the new password is valid.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-1-2
    name: Sign out and end the current web session
    type: ATOMIC
    dependencies:
    - REQ-1-1-2
    description: >
      This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
      An authenticated user ends the current web session from the account access area. When a confirmation dialog is shown, only confirmation signs out; cancellation or dismissal preserves the session. Confirmed sign-out immediately invalidates the active session, and refresh, browser back, or direct navigation to a previously accessible protected account, repository, or organization URL requires authentication again.

      Screenshot reference: ![image](reference/github-account-menu-sign-out.png)
    scenarios:
    - name: Sign out and end the current web session
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
      - keyword: WHEN
        content: The user completes the workflow to sign out and end the current web session.
      - keyword: THEN
        content: The active session ends, and protected account pages require authentication again.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-1-3
    name: Change the account password
    type: ATOMIC
    dependencies:
    - REQ-1-1-2
    description: >
      This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
      An authenticated user changes the account password from account security settings. Current password, a REQ-1-conforming new password, and an exactly matching confirmation are required. Wrong current password, nonconforming new password, mismatched confirmation, or any missing field shows a field-level reason and changes nothing: the old password remains valid and the candidate password cannot sign in. On success, the new password immediately applies to future password sign-ins and the old password no longer can sign in.

      Screenshot reference: ![image](reference/github-password-settings.png)
    scenarios:
    - name: Change the account password
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
      - keyword: WHEN
        content: The user completes the workflow to change the account password.
      - keyword: THEN
        content: The new password is saved and required for later password-based sign-in.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
- id: REQ-2
  name: Organization and Governance
  type: FOLDER
  dependencies:
  - REQ-1-1-2
  description: Basic organization membership, team and repository access management. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
  children:
  - id: REQ-2-1
    name: Organization Identity and Discovery
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: Supports public organization repository discovery and authenticated organization creation. An organization unique name follows the REQ-1 username rule and is globally unique; its display name is 1–100 non-whitespace-only characters after trimming. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
    children:
    - id: REQ-2-1-1
      name: Browse organization repositories
      type: ATOMIC
      dependencies: []
      description: >
        From the organization page, the user clicks “Repositories”, enters a repository name in the filter, optionally chooses a visibility filter, and clicks a repository name. The system shows only repositories visible to the user with name, description, visibility, and updated time, then opens the selected repository overview.
        A visitor or organization member uses this capability from organization administration or public organization pages. The capability requires that the target public object is available or the user has permission to view it. The user completes the main choices or confirmation steps for browse organization repositories. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The requested information is displayed with the relevant filters, metadata or status indicators visible to the user.

        Screenshot reference: ![image](reference/github-organization-repositories.png)
      scenarios:
      - name: Browse organization repositories
        steps:
        - keyword: GIVEN
          content: Visitor or organization member is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: From the organization page, the user clicks “Repositories”, enters a repository name in the filter, optionally chooses a visibility filter, and clicks a repository name.
        - keyword: THEN
          content: The system shows only repositories visible to the user with name, description, visibility, and updated time, then opens the selected repository overview.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-2-1-2
      name: Create an organization after authentication
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: An authenticated user enters a globally unique organization name following the REQ-1 username rule and a trimmed 1–100-character non-empty display name, then confirms. Invalid or duplicate names, invalid display names, and write failures retain non-sensitive input, show a field-level reason, and create no organization. Success saves the identifier, display name, creation time, and current user as initial owner and member, opens the overview, and lists it for the user. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
      scenarios:
      - name: Create an organization after authentication
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: The user completes the workflow to create an organization after authentication.
        - keyword: THEN
          content: The new object or relationship is saved and appears in the relevant GitHub context.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-2-2
    name: Team and Membership Management
    type: FOLDER
    dependencies:
    - REQ-2-1-2
    description: Capabilities for creating teams, inviting members, removing members and organizing access. A team name is 1–50 lowercase ASCII letters, digits, or hyphens, cannot start or end with a hyphen, and is unique within its organization. Parent teams belong to the same organization and cannot form direct or indirect cycles. Existing members and pending invitees cannot receive duplicate invites. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-2-1-2 (Create an organization after authentication); it must reuse that context and remain consistent when the prerequisite state changes.
    children:
    - id: REQ-2-2-1
      name: Create an organization team
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: An organization owner creates a team with a name following the REQ-2-2 rule, optional description, and optional parent in the same organization. Missing, invalid, duplicate names, out-of-organization parents, and failures create no team. Success creates a team in the current organization and opens its page. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-2-1-2 (Create an organization after authentication); it must reuse that context and remain consistent when the prerequisite state changes.
      scenarios:
      - name: Create an organization team
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: The owner clicks “Teams” → “New team”, enters a team name, optional description, and parent team, then clicks “Create team”.
        - keyword: THEN
          content: The system creates a team in the current organization and opens its page; duplicate names or write failures create no team.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-2-2-2
      name: Manage organization team membership and hierarchy
      type: ATOMIC
      dependencies:
      - REQ-2-2-1
      description: A visitor or organization member uses this capability from organization administration or public organization pages. The capability requires that the user is authenticated and has access to the relevant account, repository or organization. The user completes the main choices or confirmation steps for manage organization team membership and hierarchy. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The system shows an observable result and preserves the changed state for later use. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-2-2-1 (Create an organization team); it must reuse that context and remain consistent when the prerequisite state changes. On the team page, the maintainer uses “Members” to add or remove members, or uses “Settings” to select and save a new parent team. The system updates membership or hierarchy in the team tree and member list, and rejects cyclic team hierarchies.
      scenarios:
      - name: Manage organization team membership and hierarchy
        steps:
        - keyword: GIVEN
          content: Visitor or organization member is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: On the team page, the maintainer uses “Members” to add or remove members, or uses “Settings” to select and save a new parent team.
        - keyword: THEN
          content: The system updates membership or hierarchy in the team tree and member list, and rejects cyclic team hierarchies.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
      - name: Reject a cyclic team hierarchy change
        steps:
        - keyword: GIVEN
          content: A team maintainer opens an existing team that already has a parent team.
        - keyword: WHEN
          content: The maintainer selects one of the team's descendants as the new parent team and saves the change.
        - keyword: THEN
          content: The system rejects the cycle, keeps the original parent team unchanged, and shows the saved hierarchy again after reload.
    - id: REQ-2-2-3
      name: Invite a user to an organization
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: An organization owner invites an existing account by username or verified email, selects Member or Owner, and sends the invitation. The system saves one pending invitation and shows recipient and status; the invitee has no member permissions before acceptance. Existing members, pending invitees, unknown accounts, and unsupported roles show a reason and create no second invitation. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-2-1-2 (Create an organization after authentication); it must reuse that context and remain consistent when the prerequisite state changes.
      scenarios:
      - name: Invite a user to an organization
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: On the “People” page, the owner clicks “Invite member”, enters a username or email, selects an organization role, and clicks “Send invitation”.
        - keyword: THEN
          content: The system stores a pending invitation and shows its recipient and status; the recipient receives no member permissions before acceptance.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-2-2-4
      name: Remove a member from an organization
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: An organization owner uses this capability from organization administration or public organization pages. The capability requires that the user is authenticated and has the required organization permission. The user completes the main choices or confirmation steps for remove a member from an organization. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The selected object or permission is removed after confirmation, and later views reflect the removal. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-2-1-2 (Create an organization after authentication); it must reuse that context and remain consistent when the prerequisite state changes. On the “People” page, the owner locates a member, selects “Remove from organization” in the member menu, and confirms “Remove”. The system removes organization membership and direct organization access while preserving the account, personal repositories, and other organization memberships.
      scenarios:
      - name: Remove a member from an organization
        steps:
        - keyword: GIVEN
          content: Organization owner is in the relevant GitHub context, and the user is authenticated and has the required organization permission.
        - keyword: WHEN
          content: On the “People” page, the owner locates a member, selects “Remove from organization” in the member menu, and confirms “Remove”.
        - keyword: THEN
          content: The system removes organization membership and direct organization access while preserving the account, personal repositories, and other organization memberships.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
      - name: Prevent non-owners from removing organization members
        steps:
        - keyword: GIVEN
          content: A signed-in user who is not an organization owner opens the organization People page for a member they can view.
        - keyword: WHEN
          content: The user opens the member actions menu and attempts to remove that member from the organization.
        - keyword: THEN
          content: The remove action is unavailable or rejected for the non-owner, and the member remains in the organization after reload.
  - id: REQ-2-3
    name: Grant repository access to people and teams
    type: ATOMIC
    dependencies:
    - REQ-2-1-2
    - REQ-2-2-1
    description: >-
      An organization owner or repository administrator grants repository access only to current organization members or teams, selecting Read, Triage, Write, Maintain, or Admin. Each subject has one active grant per repository: repeating the same role creates no second record and changing role replaces the original. The system prevents unauthorized changes and lets members access according to the saved role. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-2-1-2 (Create an organization after authentication), REQ-2-2-1 (Create an organization team); it must reuse that context and remain consistent when the prerequisite state changes.
    scenarios:
    - name: Grant repository access to people and teams
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: The user completes the workflow to grant repository access to people and teams.
      - keyword: THEN
        content: The system applies the permission assignment, and members can access the repository according to the granted role.
      - keyword: THEN
        content: The visible state remains consistent when the object is opened again.
    - name: Replace an existing repository grant instead of duplicating it
      steps:
      - keyword: GIVEN
        content: An administrator opens repository access management for a team that already has a saved grant.
      - keyword: WHEN
        content: The administrator changes that team's role to a different level and saves the update.
      - keyword: THEN
        content: The system keeps one active grant for the team, replaces the previous role with the new role, and shows the updated grant after reload.
- id: REQ-3
  name: Repository Asset Management
  type: FOLDER
  dependencies: []
  description: Capabilities for locating, creating, opening and configuring repositories.
  children:
  - id: REQ-3-1
    name: Search and locate repositories
    type: ATOMIC
    dependencies: []
    description: >
      A visitor or authenticated user searches for repositories they are allowed to view. The system accepts a search query, applies repository-oriented filtering or scoping, and displays matching repositories with enough metadata for the user to open the intended repository.

      Screenshot reference: ![image](reference/github-repository-search-results.png)
    scenarios:
    - name: Search repositories, code, issues, pull requests and users
      steps:
      - keyword: GIVEN
        content: Repository collaborator is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
      - keyword: WHEN
        content: The user completes the workflow to search repositories, code, issues, pull requests and users.
      - keyword: THEN
        content: Matching repositories are displayed with enough metadata for the user to choose and open the intended repository.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-3-2
    name: Repository Creation and Distribution
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: Core repository creation capability. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
    children:
    - id: REQ-3-2-1
      name: Create a repository with owner, visibility and initialization options
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: >
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
        An authorized administrator uses this capability from repository pages. The capability requires that the user is authenticated and has administrator permission for the target repository. The user completes the main choices or confirmation steps for create a repository with owner, visibility and initialization options. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The new object or relationship is saved and appears in the relevant GitHub context.

        Screenshot reference: ![image](reference/github-create-repository.png)
      scenarios:
      - name: Create a repository with owner, visibility and initialization options
        steps:
        - keyword: GIVEN
          content: Authorized administrator is in the relevant GitHub context, and the user is authenticated and has administrator permission for the target repository.
        - keyword: WHEN
          content: The user completes the workflow to create a repository with owner, visibility and initialization options.
        - keyword: THEN
          content: The new object or relationship is saved and appears in the relevant GitHub context.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-3-2-2
      name: Fork a repository into another namespace
      type: ATOMIC
      dependencies:
      - REQ-3-3
      - REQ-1-1-2
      description: >
        On the source repository page, the user clicks “Fork”, selects a target account or organization, optionally enters a new name and visibility, and clicks “Create fork”. The system creates an independent fork, copies accessible default-branch history, records the source link, and opens the new fork overview.
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-3-3 (View a public repository overview), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
        An authenticated user uses this capability from repository pages. The capability requires that the user is authenticated and has access to the relevant account, repository or organization. The user completes the main choices or confirmation steps for fork a repository into another namespace. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. A new fork is created under the selected owner and links back to the source repository.

        Screenshot reference: ![image](reference/github-fork-repository.png)
      scenarios:
      - name: Fork a repository into another namespace
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: On the source repository page, the user clicks “Fork”, selects a target account or organization, optionally enters a new name and visibility, and clicks “Create fork”.
        - keyword: THEN
          content: The system creates an independent fork, copies accessible default-branch history, records the source link, and opens the new fork overview.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-3-2-3
      name: Copy a repository clone URL
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >
        On the repository overview, the user clicks “Code”, selects HTTPS or SSH, then clicks the copy icon beside the clone URL. The system writes the selected clone URL to the browser clipboard and shows a brief “Copied” confirmation without changing the repository.
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-3-3 (View a public repository overview); it must reuse that context and remain consistent when the prerequisite state changes.
        A visitor or authenticated user uses this capability from repository pages. The capability requires that the target public object is available or the user has permission to view it. The user completes the main choices or confirmation steps for copy a repository clone url. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The selected repository access value is available for the user to paste into their local tooling.

        Screenshot reference: ![image](reference/github-code-clone-menu.png)
      scenarios:
      - name: Copy a repository clone URL
        steps:
        - keyword: GIVEN
          content: Visitor or authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: On the repository overview, the user clicks “Code”, selects HTTPS or SSH, then clicks the copy icon beside the clone URL.
        - keyword: THEN
          content: The system writes the selected clone URL to the browser clipboard and shows a brief “Copied” confirmation without changing the repository.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-3-3
    name: View a public repository overview
    type: ATOMIC
    dependencies: []
    description: >
      A visitor or authorized user opens a repository overview to confirm the repository identity, visibility, description, primary metadata and available content. The overview provides the main entry point for browsing files, reviewing repository context and beginning collaboration.

      Screenshot reference: ![image](reference/github-repository-overview.png)
    scenarios:
    - name: View a public repository overview
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: The user completes the workflow to view a public repository overview.
      - keyword: THEN
        content: The overview provides the entry point for browsing files and beginning collaboration.
      - keyword: THEN
        content: The visible state remains consistent when the object is opened again.
  - id: REQ-3-4
    name: Change repository visibility with permission checks
    type: ATOMIC
    dependencies:
    - REQ-3-3
    - REQ-1-1-2
    description: >
      This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-3-3 (View a public repository overview), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
      A repository administrator changes the repository visibility after reviewing the effect on access. The system blocks unauthorized changes, applies the selected visibility and enforces the updated access rules when users open the repository later.

      Screenshot reference: ![image](reference/github-repository-visibility-settings.png)
    scenarios:
    - name: Change repository visibility with permission checks
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: The user completes the workflow to change repository visibility with permission checks.
      - keyword: THEN
        content: The system prevents unauthorized changes and applies the updated visibility to later repository access.
      - keyword: THEN
        content: The visible state remains consistent when the object is opened again.
- id: REQ-4
  name: Code and Version Control
  type: FOLDER
  dependencies:
  - REQ-3-3
