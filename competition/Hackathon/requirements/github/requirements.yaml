      steps:
      - keyword: GIVEN
        content: A signed-in user without repository administration permission opens the branch protection settings page.
      - keyword: WHEN
        content: The user attempts to create or modify a branch protection rule.
      - keyword: THEN
        content: The branch protection controls are unavailable or rejected for the non-admin, and no protection rule is saved.
  - id: REQ-6-2
    name: Pull Request Discovery and Creation
    type: FOLDER
    dependencies:
    - REQ-4-3
    description: Capabilities for finding, comparing and creating pull requests. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-3 (Branch and Tag Management); it must reuse that context and remain consistent when the prerequisite state changes.
    children:
    - id: REQ-6-2-1
      name: List and filter repository pull requests
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-3-3 (View a public repository overview); it must reuse that context and remain consistent when the prerequisite state changes.
        A repository participant lists pull requests and filters the list by state or review-relevant metadata to find proposals that need attention.

        Screenshot reference: ![image](reference/github-pull-requests-list.png)
      scenarios:
      - name: List and filter repository pull requests
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: The user completes the workflow to list and filter repository pull requests.
        - keyword: THEN
          content: A repository participant lists pull requests and filters the list by state or review-relevant metadata to find proposals that need attention.
        - keyword: THEN
          content: The visible state remains consistent when the object is opened again.
    - id: REQ-6-2-2
      name: Compare branches before opening a pull request
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >
        On “Pull requests”, the collaborator clicks “New pull request”, selects base and compare branches, then clicks “Compare changes”. The system shows comparable commit count, changed files, and a diff summary; identical branches or no differences disable creation and explain why.
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-4-3-1 (List and switch repository branches), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
        A repository collaborator uses this capability from repository pull-request pages. The capability requires that the user is authenticated and has the required repository collaboration permission. The user completes the main choices or confirmation steps for compare branches before opening a pull request. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The system shows an observable result and preserves the changed state for later use.

        Screenshot reference: ![image](reference/github-compare-branches.png)
      scenarios:
      - name: Compare branches before opening a pull request
        steps:
        - keyword: GIVEN
          content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: On “Pull requests”, the collaborator clicks “New pull request”, selects base and compare branches, then clicks “Compare changes”.
        - keyword: THEN
          content: The system shows comparable commit count, changed files, and a diff summary; identical branches or no differences disable creation and explain why.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
      - name: Disable pull request creation when base and compare branches are identical
        steps:
        - keyword: GIVEN
          content: A collaborator opens the compare view for a repository with a selectable base branch and compare branch.
        - keyword: WHEN
          content: The collaborator selects the same branch for both base and compare and clicks Compare changes.
        - keyword: THEN
          content: The system explains that the branches are identical or have no differences and keeps pull request creation disabled.
    - id: REQ-6-2-3
      name: Create a pull request from a compare result
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: A repository collaborator uses this capability from repository pull-request pages. The capability requires that the user is authenticated and has the required repository collaboration permission. The user completes the main choices or confirmation steps for create a pull request from a compare result. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The new object or relationship is saved and appears in the relevant GitHub context. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-2 (Compare branches before opening a pull request); it must reuse that context and remain consistent when the prerequisite state changes. From a valid comparison, the user clicks “Create pull request”, enters a non-empty title and optional description, confirms the branches, and clicks “Create pull request”. The system creates an open pull request with a repository-local number and opens its details; no differences, empty title, or failure creates no record.
      scenarios:
      - name: Create a pull request from a compare result
        steps:
        - keyword: GIVEN
          content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: From a valid comparison, the user clicks “Create pull request”, enters a non-empty title and optional description, confirms the branches, and clicks “Create pull request”.
        - keyword: THEN
          content: The system creates an open pull request with a repository-local number and opens its details; no differences, empty title, or failure creates no record.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-6-2-4
      name: Create a draft pull request
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: A repository collaborator uses this capability from repository pull-request pages. The capability requires that the user is authenticated and has the required repository collaboration permission. The user completes the main choices or confirmation steps for create a draft pull request. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The new object or relationship is saved and appears in the relevant GitHub context. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-2 (Compare branches before opening a pull request); it must reuse that context and remain consistent when the prerequisite state changes. After selecting base and compare branches, the user clicks “Create draft pull request”, enters a title and optional description, and confirms creation. The system creates a pull request with Draft status and displays its “Draft” badge; it cannot merge until it is ready and all merge conditions are met.
      scenarios:
      - name: Create a draft pull request
        steps:
        - keyword: GIVEN
          content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
        - keyword: WHEN
          content: After selecting base and compare branches, the user clicks “Create draft pull request”, enters a title and optional description, and confirms creation.
        - keyword: THEN
          content: The system creates a pull request with Draft status and displays its “Draft” badge; it cannot merge until it is ready and all merge conditions are met.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-6-3
    name: Pull Request Review Workspace
    type: FOLDER
    dependencies:
    - REQ-6-2-3
    description: Capabilities for reading, inspecting and reviewing pull requests. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-3 (Create a pull request from a compare result); it must reuse that context and remain consistent when the prerequisite state changes.
    children:
    - id: REQ-6-3-1
      name: Review a pull request overview and commits
      type: ATOMIC
      dependencies:
      - REQ-6-2-3
      description: A reviewer opens a pull request to understand its title, branches, conversation, included commits and merge context before reviewing the proposed changes. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-3 (Create a pull request from a compare result); it must reuse that context and remain consistent when the prerequisite state changes.
      scenarios:
      - name: Review a pull request overview and commits
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: The user completes the workflow to review a pull request overview and commits.
        - keyword: THEN
          content: A reviewer opens a pull request to understand its title, branches, conversation, included commits and merge context before reviewing the proposed changes.
        - keyword: THEN
          content: The visible state remains consistent when the object is opened again.
    - id: REQ-6-3-2
      name: Inspect changed files and the aggregate diff
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      description: A visitor or authenticated user uses this capability from repository code and version-control pages. The capability requires that the target public object is available or the user has permission to view it. The user completes the main choices or confirmation steps for inspect changed files and the aggregate diff. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The requested information is displayed with the relevant filters, metadata or status indicators visible to the user. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-3-1 (Review a pull request overview and commits); it must reuse that context and remain consistent when the prerequisite state changes. On the pull-request page, the reviewer clicks “Files changed”, selects a file, expands its diff, and uses file navigation to inspect added and deleted lines. The system shows paths, additions, deletions, and totals for the pull request’s current source and target commits; viewing changes no file or review state.
      scenarios:
      - name: Inspect changed files and the aggregate diff
        steps:
        - keyword: GIVEN
          content: Visitor or authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: On the pull-request page, the reviewer clicks “Files changed”, selects a file, expands its diff, and uses file navigation to inspect added and deleted lines.
        - keyword: THEN
          content: The system shows paths, additions, deletions, and totals for the pull request’s current source and target commits; viewing changes no file or review state.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-6-3-3
      name: Add review comments to changed lines
      type: ATOMIC
      dependencies:
      - REQ-6-3-2
      - REQ-1-1-2
      description: An authenticated user uses this capability from repository pull-request pages. The capability requires that the target public object is available or the user has permission to view it. The user completes the main choices or confirmation steps for add review comments to changed lines. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The system shows an observable result and preserves the changed state for later use. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-3-2 (Inspect changed files and the aggregate diff), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes. In “Files changed”, the reviewer hovers a target added or deleted line, clicks “+”, enters a comment, then chooses “Add single comment” or “Start a review”. The system associates the comment with the pull request, file path, diff commit, and line; review-started comments remain pending, while a single comment appears immediately.
      scenarios:
      - name: Add review comments to changed lines
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: In “Files changed”, the reviewer hovers a target added or deleted line, clicks “+”, enters a comment, then chooses “Add single comment” or “Start a review”.
        - keyword: THEN
          content: The system associates the comment with the pull request, file path, diff commit, and line; review-started comments remain pending, while a single comment appears immediately.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
      - name: Keep review-started inline comments pending until submission
        steps:
        - keyword: GIVEN
          content: A reviewer opens the Files changed view for a pull request and targets a changed line.
        - keyword: WHEN
          content: The reviewer enters an inline comment and chooses Start a review instead of Add single comment.
        - keyword: THEN
          content: The system keeps the comment pending, does not publish it immediately, and shows it only after the review is submitted.
    - id: REQ-6-3-4
      name: Submit a pull-request review
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      - REQ-1-1-2
      description: A reviewer requests review, comments on the proposal, approves it or requests changes. The system records the review decision so authors and maintainers can act on it. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-3-1 (Review a pull request overview and commits), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
      scenarios:
      - name: Submit a pull-request review
        steps:
        - keyword: GIVEN
          content: The user is in the relevant repository, organization or account context and has the required permission.
        - keyword: WHEN
          content: The user completes the workflow to submit a pull-request review.
        - keyword: THEN
          content: The system records the review decision so authors and maintainers can act on it.
        - keyword: THEN
          content: The visible state remains consistent when the object is opened again.
      - name: Record a request-changes review decision
        steps:
        - keyword: GIVEN
          content: A reviewer opens a pull request that is ready for review.
        - keyword: WHEN
          content: The reviewer enters review feedback, selects Request changes, and submits the review.
        - keyword: THEN
          content: The system stores the review comment and changes-requested state, and the pull request shows that decision after reload.
  - id: REQ-6-4
    name: Request or remove pull-request reviewers
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: A pull-request author or maintainer requests reviewers or removes reviewer requests from a pull request. The system validates repository permissions, updates the review assignment state and shows the current requested reviewers on the pull request. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-3 (Create a pull request from a compare result), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
    scenarios:
    - name: Request or remove pull-request reviewers
      steps:
      - keyword: GIVEN
        content: Authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
      - keyword: WHEN
        content: The user completes the workflow to request or remove pull-request reviewers.
      - keyword: THEN
        content: The pull request shows the updated reviewer request state.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-6-5
    name: Merge an eligible pull request
    type: ATOMIC
    dependencies:
    - REQ-6-3-4
    - REQ-6-1
    description: An authorized maintainer merges a pull request after the proposal is eligible for integration. The system checks the required permissions and merge conditions, integrates the approved changes into the target branch and updates the pull request to show the merged state. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-3-4 (Submit a pull-request review), REQ-6-1 (Protect branches with review and status-check requirements); it must reuse that context and remain consistent when the prerequisite state changes.
    scenarios:
    - name: Merge an eligible pull request
      steps:
      - keyword: GIVEN
        content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
      - keyword: WHEN
        content: The user completes the workflow to merge an eligible pull request.
      - keyword: THEN
        content: The approved changes are integrated according to the selected merge policy and the pull request shows the resulting state.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-6-6
    name: Close or reopen a pull request without merging
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: A pull-request author or maintainer closes a pull request without merging when the proposed changes should not proceed, or reopens it when work should continue. The system records the state transition and keeps the pull request discussion and proposed changes available according to repository permissions. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-3 (Create a pull request from a compare result), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
    scenarios:
    - name: Close or reopen a pull request without merging
      steps:
      - keyword: GIVEN
        content: Repository collaborator is in the relevant GitHub context, and the user is authenticated and has the required repository collaboration permission.
      - keyword: WHEN
        content: The user completes the workflow to close or reopen a pull request without merging.
      - keyword: THEN
        content: The pull request changes to the selected state and the transition is visible in its activity history.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
    - name: Prevent non-authors and non-maintainers from closing a pull request
      steps:
      - keyword: GIVEN
        content: A signed-in viewer who is neither the pull request author nor a maintainer opens a protected pull request.
      - keyword: WHEN
        content: The viewer looks for close or reopen actions or tries to change the pull request state.
      - keyword: THEN
        content: The close and reopen actions are unavailable or rejected, and the pull request state stays unchanged.
data:
- category: Account and permission seed data
  items:
  - The system includes verified accounts that can sign in by username or verified email, recover access by verified email, change passwords, and sign out from protected pages.
  - The system includes verified accounts with organization owner, organization non-owner, team maintainer, repository owner, repository administrator, non-admin collaborator, viewer, branch contributor, file contributor, issue author, issue editor, issue commenter, issue viewer, pull-request author, pull-request maintainer, pull-request reviewer, and pull-request contributor roles.
  - The system includes protected account, organization, repository, issue, and pull-request pages that require authentication when opened directly after sign-out.
- category: Organization and repository seed data
  items:
  - The system includes a public organization with at least one public repository visible to visitors and at least one private repository hidden from visitors who lack permission.
  - The system includes an organization that an owner account can manage, with members, invite candidates, pending invitees, removable members, teams, a team candidate user, and nested teams suitable for membership and hierarchy validation.
  - The system includes public and private repositories with distinct names for repository search, public repository viewing, clone URL copying, and visibility filtering.
  - The system includes repositories administered by seeded accounts for access grants, role changes, visibility changes, default branch changes, branch protection, file changes, and pull-request workflows.
  - The system includes a source repository that can be forked by a seeded user, plus an existing fork that can be detected as already present.
- category: Code, branch, and commit seed data
  items:
  - The system includes a code repository with a browsable directory, a known file name, visible file content, searchable code text, and an empty-result search term.
  - The system includes commit history for a repository, including at least one visible commit message and author.
  - The system includes a commit detail page with a changed file and enough diff content to inspect added and deleted lines.
  - The system includes a branch repository with an active branch, another selectable branch, a file that exists only on the target branch, and a branch-name query that returns no matching branch.
  - The system includes a repository with old and new default branch choices, accessible to an administrator and inaccessible for default-branch changes by a non-administrator.
  - The system includes a branch-protection repository and branch-name pattern that can be protected by an administrator and cannot be modified by a non-administrator.
- category: Issue seed data
  items:
  - The system includes an issues list with at least one open issue title and one closed issue title for filtering.
  - The system includes an issue detail page with a stable title and description visible to visitors or authorized users.
  - The system includes editable, invalid-edit, commentable, comment-validation, assignable, labelable, milestone, closable, and protected issues for issue editing, commenting, metadata, and state-transition tests.
  - The system includes issue assignee, label, and milestone values that are available from the relevant issue controls.
- category: Pull request seed data
  items:
  - The system includes a pull-request list with at least one open pull-request title for filtering.
  - The system includes branches that can be compared for pull-request creation, including a valid base branch, compare branch, changed file, no-difference comparison, normal compare URL, and draft compare URL.
  - The system includes pull-request detail pages for overview, public changed-files inspection, inline review comments, pending review comments, review submission, change-request review submission, reviewer assignment, merging, unmergeable merge validation, closing or reopening, and protected close/reopen authorization checks.
  - The system includes reviewer usernames available for pull-request reviewer request tests.
