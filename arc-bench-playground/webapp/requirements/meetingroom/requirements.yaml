id: ROOT
name: Meeting Room Reservation System
type: FOLDER
description: 'A small web-based meeting room reservation system that provides home page navigation, user login and logout, meeting room booking, and personal reservation management.'
dependencies: []
children:
  - id: REQ-1
    name: System Home
    type: FOLDER
    description: 'The default landing page after the system starts. The top area shows "assets/logo.png" on the left, and "Login" and "My Reservations" on the right. The main area shows a hero banner, a quick room overview section, and a primary action button that leads to the reservation page. ![image](./reference/homepage.png)'
    dependencies: []
    children:
      - id: REQ-1.1
        name: Open system home page
        type: ATOMIC
        description: 'Display the home page with the top logo, navigation links, hero banner, room overview section, and the primary "Reserve a room" button. ![image](./reference/homepage.png)'
        dependencies: []
        scenarios:
          - name: Display the default home page
            steps:
              - keyword: GIVEN
                content: 'The system is accessible.'
              - keyword: WHEN
                content: 'Open the application entry URL.'
              - keyword: THEN
                content: 'The page shows "assets/logo.png" at the top-left, the "Login" link, the "My Reservations" link, a hero banner, a room overview section, and the "Reserve a room" button.'
      - id: REQ-1.2
        name: Show room overview cards
        type: ATOMIC
        description: 'Display three room overview cards on the home page for "Room A", "Room B", and "Room C". Each card shows a room image, capacity, equipment summary, and availability status. The room images use "assets/room-a.png", "assets/room-b.png", and "assets/room-c.png". ![image](./reference/room-cards.png)'
        dependencies:
          - REQ-1.1
        scenarios:
          - name: Show room overview cards on the home page
            steps:
              - keyword: GIVEN
                content: 'The user is on the home page.'
              - keyword: WHEN
                content: 'Observe the room overview section.'
              - keyword: THEN
                content: 'The page shows visible cards for "Room A", "Room B", and "Room C" with room image, capacity, equipment summary, and availability status.'
  - id: REQ-2
    name: User Authentication
    type: FOLDER
    description: 'Allow a user to log in before creating or managing reservations, and allow the user to log out after use.'
    dependencies:
      - REQ-1
    children:
      - id: REQ-2.1
        name: Open login page
        type: ATOMIC
        description: 'Open the login page from the "Login" link in the top-right area of the home page.'
        dependencies:
          - REQ-1.1
        scenarios:
          - name: Open the login page from the home page
            steps:
              - keyword: GIVEN
                content: 'The user is on the home page and is not logged in.'
              - keyword: WHEN
                content: 'Click the "Login" link in the top-right area.'
              - keyword: THEN
                content: 'Navigate to the login page.'
      - id: REQ-2.2
        name: View login form
        type: ATOMIC
        description: 'Display the login form with an input labeled "Email", a password input labeled "Password", and a "LOGIN" button. ![image](./reference/login.png)'
        dependencies:
          - REQ-2.1
        scenarios:
          - name: Display the login form layout
            steps:
              - keyword: GIVEN
                content: 'The user is on the login page.'
              - keyword: WHEN
                content: 'Observe the page.'
              - keyword: THEN
                content: 'The page shows the "Email" input, the "Password" input, and the "LOGIN" button.'
      - id: REQ-2.3
        name: Submit valid login credentials
        type: ATOMIC
        description: 'Allow the user to log in with a valid email address and password, persist the login state, and navigate back to the home page with the user status updated.'
        dependencies:
          - REQ-2.2
        scenarios:
          - name: Log in with valid credentials
            steps:
              - keyword: GIVEN
                content: 'The user is on the login page with a registered email address and the correct password entered.'
              - keyword: WHEN
                content: 'Click the "LOGIN" button.'
              - keyword: THEN
                content: 'The system persists the login state and navigates to the home page showing the logged-in user status.'
      - id: REQ-2.4
        name: Block login with invalid credentials
        type: ATOMIC
        description: 'Reject login when the email address does not exist or the password is incorrect, and show the message "Invalid email or password.".'
        dependencies:
          - REQ-2.2
        scenarios:
          - name: Submit the login form with invalid credentials
            steps:
              - keyword: GIVEN
                content: 'The user is on the login page with an unregistered email address or an incorrect password entered.'
              - keyword: WHEN
                content: 'Click the "LOGIN" button.'
              - keyword: THEN
                content: 'The page shows "Invalid email or password." and does not complete login.'
      - id: REQ-2.5
        name: Log out
        type: ATOMIC
        description: 'Allow the logged-in user to log out from the top-right area, clear the login state, and show the public home page.'
        dependencies:
          - REQ-2.3
        scenarios:
          - name: Log out from the home page
            steps:
              - keyword: GIVEN
                content: 'The user is logged in and is on the home page.'
              - keyword: WHEN
                content: 'Click the "Logout" link in the top-right area.'
              - keyword: THEN
                content: 'The system clears the login state and shows the public home page with the "Login" link visible again.'
  - id: REQ-3
    name: Meeting Room Reservation
    type: FOLDER
    description: 'Allow a logged-in user to open the reservation page, inspect room schedule information, and create a reservation for an available room and time slot.'
    dependencies:
      - REQ-2
    children:
      - id: REQ-3.1
        name: Open reservation page
        type: ATOMIC
        description: 'Open the reservation page from the "Reserve a room" button on the home page or from a room overview card.'
        dependencies:
          - REQ-1.1
          - REQ-2.3
        scenarios:
          - name: Open the reservation page from the home page
            steps:
              - keyword: GIVEN
                content: 'The user is logged in and is on the home page.'
              - keyword: WHEN
                content: 'Click the "Reserve a room" button.'
              - keyword: THEN
                content: 'Navigate to the reservation page.'
      - id: REQ-3.2
        name: View reservation form and room schedule
        type: ATOMIC
        description: 'Display the reservation page with a room selector, a date picker, start time and end time selectors, a topic input, a participant count input, a remarks input, a visible schedule panel, and a "Submit Reservation" button. ![image](./reference/reservation-page.png)'
        dependencies:
          - REQ-3.1
        scenarios:
          - name: Display the reservation form layout
            steps:
              - keyword: GIVEN
                content: 'The user is on the reservation page.'
              - keyword: WHEN
                content: 'Observe the page.'
              - keyword: THEN
                content: 'The page shows the room selector, date picker, start time selector, end time selector, topic input, participant count input, remarks input, schedule panel, and the "Submit Reservation" button.'
      - id: REQ-3.3
        name: Submit valid reservation information
        type: ATOMIC
        description: 'Allow the user to submit a reservation with a selected room, valid date, valid time range, topic, and participant count, persist the reservation, and show a successful reservation message.'
        dependencies:
          - REQ-3.2
        scenarios:
          - name: Submit a valid reservation
            steps:
              - keyword: GIVEN
                content: 'The user is on the reservation page with an available room selected, a valid date selected, a valid start time earlier than the end time, a topic entered, and a valid participant count entered.'
              - keyword: WHEN
                content: 'Click the "Submit Reservation" button.'
              - keyword: THEN
                content: 'The system persists the reservation information and shows a successful reservation message.'
      - id: REQ-3.4
        name: Block reservation with conflicting time slot
        type: ATOMIC
        description: 'Reject reservation when the selected room already has another reservation that overlaps with the selected time range, and show the message "This room is already reserved for the selected time slot.".'
        dependencies:
          - REQ-3.2
        scenarios:
          - name: Submit the form with an overlapping reservation time
            steps:
              - keyword: GIVEN
                content: 'The user is on the reservation page with a room selected and a time range that overlaps with an existing reservation for the same room.'
              - keyword: WHEN
                content: 'Click the "Submit Reservation" button.'
              - keyword: THEN
                content: 'The page shows "This room is already reserved for the selected time slot." and does not create the reservation.'
      - id: REQ-3.5
        name: Block reservation with missing required fields
        type: ATOMIC
        description: 'Reject reservation when the room, date, start time, end time, topic, or participant count is missing, and show the message "Please fill in all required fields.".'
        dependencies:
          - REQ-3.2
        scenarios:
          - name: Submit the form with missing required information
            steps:
              - keyword: GIVEN
                content: 'The user is on the reservation page with one or more required fields left empty.'
              - keyword: WHEN
                content: 'Click the "Submit Reservation" button.'
              - keyword: THEN
                content: 'The page shows "Please fill in all required fields." and does not create the reservation.'
  - id: REQ-4
    name: My Reservations
    type: FOLDER
    description: 'Allow a logged-in user to view the reservations they created and cancel a future reservation.'
    dependencies:
      - REQ-2
      - REQ-3
    children:
      - id: REQ-4.1
        name: View my reservation list
        type: ATOMIC
        description: 'Display the "My Reservations" page with a table showing reservation topic, room name, reservation date, time range, status, and operation column. ![image](./reference/my-reservations.png)'
        dependencies:
          - REQ-2.3
          - REQ-3.3
        scenarios:
          - name: Open the personal reservation list
            steps:
              - keyword: GIVEN
                content: 'The user is logged in and has at least one reservation.'
              - keyword: WHEN
                content: 'Click the "My Reservations" link.'
              - keyword: THEN
                content: 'Navigate to the "My Reservations" page and show the reservation table with the created reservation records.'
      - id: REQ-4.2
        name: Cancel a future reservation
        type: ATOMIC
        description: 'Allow the user to cancel one future reservation from the reservation list, update the reservation status to cancelled, release the time slot, and show a successful cancellation message.'
        dependencies:
          - REQ-4.1
        scenarios:
          - name: Cancel one future reservation
            steps:
              - keyword: GIVEN
                content: 'The user is on the "My Reservations" page with at least one future reservation shown in the list.'
              - keyword: WHEN
                content: 'Click the "Cancel" button for one reservation.'
              - keyword: THEN
                content: 'The system updates the reservation status to cancelled, releases the room time slot, and shows a successful cancellation message.'
