        content: The user completes the workflow to request or remove pull-request reviewers.
      - keyword: THEN
        content: The pull request shows the updated reviewer request state.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-6-5
    name: Merge an eligible pull request
    type: ATOMIC
    dependencies:
    - REQ-6-3-4
    - REQ-6-1
    description: An authorized maintainer merges a pull request after the proposal is eligible for integration. The system checks the required permissions and merge conditions, integrates the approved changes into the target branch and updates the pull request to show the merged state. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-3-4 (Submit a pull-request review), REQ-6-1 (Protect branches with review and status-check requirements); it must reuse that context and remain consistent when the prerequisite state changes.
