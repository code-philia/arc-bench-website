        - keyword: THEN
          content: The system records the review decision so authors and maintainers can act on it.
        - keyword: THEN
          content: The visible state remains consistent when the object is opened again.
  - id: REQ-6-4
    name: Request or remove pull-request reviewers
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: A pull-request author or maintainer requests reviewers or removes reviewer requests from a pull request. The system validates repository permissions, updates the review assignment state and shows the current requested reviewers on the pull request. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-3 (Create a pull request from a compare result), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
