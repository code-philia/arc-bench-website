- id: REQ-3
  name: Repository Asset Management
  type: FOLDER
  dependencies: []
  description: Capabilities for locating, creating, opening and configuring repositories.
  children:
  - id: REQ-3-1
    name: Search and locate repositories
    type: ATOMIC
    dependencies: []
    description: >
      A visitor or authenticated user searches for repositories they are allowed to view. The system accepts a search query, applies repository-oriented filtering or scoping, and displays matching repositories with enough metadata for the user to open the intended repository.

      Screenshot reference: ![image](reference/github-repository-search-results.png)
    scenarios:
    - name: Search repositories, code, issues, pull requests and users
      steps:
      - keyword: GIVEN
        content: Repository collaborator is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
      - keyword: WHEN
        content: The user completes the workflow to search repositories, code, issues, pull requests and users.
      - keyword: THEN
        content: Matching repositories are displayed with enough metadata for the user to choose and open the intended repository.
      - keyword: THEN
        content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-3-2
    name: Repository Creation and Distribution
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: Core repository creation capability. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
    children:
    - id: REQ-3-2-1
      name: Create a repository with owner, visibility and initialization options
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: >
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
        An authorized administrator uses this capability from repository pages. The capability requires that the user is authenticated and has administrator permission for the target repository. The user completes the main choices or confirmation steps for create a repository with owner, visibility and initialization options. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The new object or relationship is saved and appears in the relevant GitHub context.

        Screenshot reference: ![image](reference/github-create-repository.png)
      scenarios:
      - name: Create a repository with owner, visibility and initialization options
        steps:
        - keyword: GIVEN
          content: Authorized administrator is in the relevant GitHub context, and the user is authenticated and has administrator permission for the target repository.
        - keyword: WHEN
          content: The user completes the workflow to create a repository with owner, visibility and initialization options.
        - keyword: THEN
          content: The new object or relationship is saved and appears in the relevant GitHub context.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-3-2-2
      name: Fork a repository into another namespace
      type: ATOMIC
      dependencies:
      - REQ-3-3
      - REQ-1-1-2
      description: >
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-3-3 (View a public repository overview), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
        An authenticated user uses this capability from repository pages. The capability requires that the user is authenticated and has access to the relevant account, repository or organization. The user completes the main choices or confirmation steps for fork a repository into another namespace. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. A new fork is created under the selected owner and links back to the source repository.

        Screenshot reference: ![image](reference/github-fork-repository.png)
      scenarios:
      - name: Fork a repository into another namespace
        steps:
        - keyword: GIVEN
          content: Authenticated user is in the relevant GitHub context, and the user is authenticated and has access to the relevant account, repository or organization.
        - keyword: WHEN
          content: The user completes the workflow to fork a repository into another namespace.
        - keyword: THEN
          content: A new fork is created under the selected owner and links back to the source repository.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
    - id: REQ-3-2-3
      name: Copy a repository clone URL
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >
        This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-3-3 (View a public repository overview); it must reuse that context and remain consistent when the prerequisite state changes.
        A visitor or authenticated user uses this capability from repository pages. The capability requires that the target public object is available or the user has permission to view it. The user completes the main choices or confirmation steps for copy a repository clone url. The system validates eligibility, shows any required warnings or unavailable states, and prevents unauthorized changes. The selected repository access value is available for the user to paste into their local tooling.

        Screenshot reference: ![image](reference/github-code-clone-menu.png)
      scenarios:
      - name: Copy a repository clone URL
        steps:
        - keyword: GIVEN
          content: Visitor or authenticated user is in the relevant GitHub context, and the target public object is available or the user has permission to view it.
        - keyword: WHEN
          content: The user completes the workflow to copy a repository clone url.
        - keyword: THEN
          content: The selected repository access value is available for the user to paste into their local tooling.
        - keyword: THEN
          content: The visible GitHub page or object reflects the final state when it is opened again.
  - id: REQ-3-3
    name: View a public repository overview
    type: ATOMIC
    dependencies: []
    description: >
      A visitor or authorized user opens a repository overview to confirm the repository identity, visibility, description, primary metadata and available content. The overview provides the main entry point for browsing files, reviewing repository context and beginning collaboration.

      Screenshot reference: ![image](reference/github-repository-overview.png)
    scenarios:
    - name: View a public repository overview
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: The user completes the workflow to view a public repository overview.
      - keyword: THEN
        content: The overview provides the entry point for browsing files and beginning collaboration.
      - keyword: THEN
        content: The visible state remains consistent when the object is opened again.
  - id: REQ-3-4
    name: Change repository visibility with permission checks
    type: ATOMIC
    dependencies:
    - REQ-3-3
    - REQ-1-1-2
    description: >
      This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-3-3 (View a public repository overview), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
      A repository administrator changes the repository visibility after reviewing the effect on access. The system blocks unauthorized changes, applies the selected visibility and enforces the updated access rules when users open the repository later.

      Screenshot reference: ![image](reference/github-repository-visibility-settings.png)
    scenarios:
    - name: Change repository visibility with permission checks
      steps:
      - keyword: GIVEN
        content: The user is in the relevant repository, organization or account context and has the required permission.
      - keyword: WHEN
        content: The user completes the workflow to change repository visibility with permission checks.
      - keyword: THEN
        content: The system prevents unauthorized changes and applies the updated visibility to later repository access.
      - keyword: THEN
        content: The visible state remains consistent when the object is opened again.
