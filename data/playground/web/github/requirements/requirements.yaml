  - id: REQ-6-6
    name: Close or reopen a pull request without merging
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: A pull-request author or maintainer closes a pull request without merging when the proposed changes should not proceed, or reopens it when work should continue. The system records the state transition and keeps the pull request discussion and proposed changes available according to repository permissions. This requirement is performed in the authenticated session, page, or persistent resource context established by REQ-6-2-3 (Create a pull request from a compare result), REQ-1-1-2 (Sign in with an existing account); it must reuse that context and remain consistent when the prerequisite state changes.
