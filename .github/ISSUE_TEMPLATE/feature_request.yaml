name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels:
  - feature
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Describe the feature you would like to add.
      placeholder: |
        Provide a clear and concise description of the proposed feature.
    validations:
      required: true

  - type: dropdown
    id: feature_type
    attributes:
      label: Feature Type
      description: Select the category that best matches this feature.
      options:
        - Frontend
        - Backend
        - System
        - Other
    validations:
      required: true

  - type: textarea
    id: implementation_approach
    attributes:
      label: Possible Implementation Approach
      description: Describe any ideas, architecture, technologies, or approaches that could be used to implement this feature.
      placeholder: |
        Example:
        - Add a new API endpoint
        - Extend the existing service layer
        - Introduce a new frontend component
        - Update deployment configuration
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, references, or related information.
      placeholder: Include links, mockups, diagrams, or related issues if applicable.
    validations:
      required: false