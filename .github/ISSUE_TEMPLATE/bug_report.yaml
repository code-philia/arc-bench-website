name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of the bug.
      placeholder: |
        Describe what happened and why it is a problem.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Explain how to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Enter '...'
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
      placeholder: The system should...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: Describe what actually happened.
      placeholder: The system instead...
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected Area
      description: Select the area where the bug occurs.
      options:
        - Frontend
        - Backend
        - System
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious is this issue?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide environment details.
      placeholder: |
        - OS:
        - Browser:
        - App Version:
        - API Version:
        - Deployment Environment (Dev/Staging/Production):
    validations:
      required: false

  - type: textarea
    id: logs_and_screenshots
    attributes:
      label: Logs / Screenshots
      description: Attach relevant logs, stack traces, or screenshots.
      placeholder: Paste logs or drag and drop screenshots here.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other relevant information.
      placeholder: Related issues, workarounds, observations, etc.
    validations:
      required: false